esphome:
  name: pipboy-lvgl-base
  friendly_name: Pip-Boy LVGL Base
  on_boot:
    priority: 800
    then:
      - output.turn_on: backlight_pin

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  # This is the ONE and ONLY place this command is allowed to exist
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

# =========================================
# SYSTEM CONFIGURATION
# =========================================
logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

debug: 
  update_interval: 5s

api:
  encryption:
    key: !secret pipboy_api_key 
  # services:
  #   - service: trigger_meltdown
  #     then:
  #       - lambda: |-
  #           id(active_main_tab) = 0; // Force to STAT tab
  #           id(active_sub_tab) = 0;  // Force to STATUS sub-tab
  #           id(vault_hp) -= 50;      // Cut health
  #           ESP_LOGW("pipboy", "OVERSEER INITIATED REACTOR MELTDOWN!");

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .home 

# =========================================
# --- HARDWARE BUSES ---
# =========================================
output:
  - platform: gpio
    pin: GPIO2
    id: backlight_pin
    inverted: true

i2c:
  - sda: GPIO19
    scl: GPIO20
    scan: true
    id: bus_a

interval:
  # The Animation Clock
  - interval: 100ms # Decrease to 50ms to make him walk faster!
    then:
      - animation.next_frame: anim_vault_boy

# --- THE DISPLAY HARDWARE ---
# Notice there is no lambda here anymore! LVGL takes control.
display:
  - platform: rpi_dpi_rgb
    id: my_display
    dimensions:
      width: 800
      height: 480
    pclk_frequency: 15MHz
    hsync_pulse_width: 1
    hsync_back_porch: 42
    hsync_front_porch: 20
    vsync_pulse_width: 10
    vsync_back_porch: 12
    vsync_front_porch: 4
    pclk_inverted: true
    color_order: rgb
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    data_pins:
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO1]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]

touchscreen:
  - platform: gt911
    display: my_display
    interrupt_pin: GPIO18
    reset_pin: GPIO38
    id: my_touch

# =========================================
# GLOBAL COLORS
# =========================================
color:
  - id: pip_bright
    red: 0%
    green: 100%
    blue: 0%
  - id: pip_unselected
    red: 0%
    green: 60%
    blue: 0%
  - id: pip_line 
    red: 0%
    green: 20%
    blue: 0%

# =========================================
# GLOBAL FONTS
# =========================================
font:
  - file: "monofonto.otf"
    id: pip_main_font
    size: 36
    glyphs: 
      - ' !"%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
  - file: "monofonto.otf"
    id: pip_sub_font
    size: 27
    glyphs:
      - ' !"%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
      - 'Σ'

animation:
  - file: "vaultboy_walking.gif"
    id: anim_vault_boy
    type: RGB565

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  bg_color: 0x000000

  pages:
    - id: main_interface
      bg_color: 0x000000
      widgets:
        
        # ==========================================
        # TOP NAVIGATION MENU
        # ==========================================
        - label:
            text: "STAT2"
            x: 50
            y: 20
            text_font: pip_main_font
            text_color: pip_bright
        - label:
            text: "INV"
            x: 200
            y: 20
            text_font: pip_main_font
            text_color: pip_unselected
        - label:
            text: "DATA"
            x: 350
            y: 20
            text_font: pip_main_font
            text_color: pip_unselected
        - label:
            text: "MAP"
            x: 500
            y: 20
            text_font: pip_main_font
            text_color: pip_unselected
            
        # The thick separator line below the menu
        - obj:
            x: 10
            y: 70
            width: 588
            height: 4
            bg_color: pip_bright
            border_width: 0

        # ==========================================
        # ANIMATED VAULT BOY
        # ==========================================
        - image:
            src: anim_vault_boy
            x: 40
            y: 120

        # ==========================================
        # RAD GAUGE (Stacked Method)
        # ==========================================
        # 1. The Background Track (Dark Green, fixed at 100%)
        - arc:
            x: 320
            y: 140
            width: 240
            height: 240
            min_value: 0
            max_value: 100
            value: 100 
            arc_color: pip_line
            arc_width: 20

        # 2. The Foreground Gauge (Bright Green, live values)
        - arc:
            id: ui_rad_gauge
            x: 320
            y: 140
            width: 240
            height: 240
            min_value: 0
            max_value: 1000
            value: 45 
            arc_color: pip_bright
            arc_width: 20
            widgets:
              - label:
                  text: "RADS"
                  align: CENTER
                  y: -30
                  text_font: pip_sub_font
                  text_color: pip_bright
              - label:
                  id: ui_rad_text
                  text: "45"
                  align: CENTER
                  y: 20
                  text_font: pip_main_font
                  text_color: pip_bright
