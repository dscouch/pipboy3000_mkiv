esphome:
  name: pipboy-lvgl-base
  friendly_name: Pip-Boy LVGL Base
  on_boot:
    priority: 800
    then:
      - output.turn_on: backlight_pin

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  # This is the ONE and ONLY place this command is allowed to exist
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

# =========================================
# SYSTEM CONFIGURATION
# =========================================
logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

debug: 
  update_interval: 5s

api:
  encryption:
    key: !secret pipboy_api_key 
  # services:
  #   - service: trigger_meltdown
  #     then:
  #       - lambda: |-
  #           id(active_main_tab) = 0; // Force to STAT tab
  #           id(active_sub_tab) = 0;  // Force to STATUS sub-tab
  #           id(vault_hp) -= 50;      // Cut health
  #           ESP_LOGW("pipboy", "OVERSEER INITIATED REACTOR MELTDOWN!");

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .home 

# =========================================
# --- HARDWARE BUSES ---
# =========================================
output:
  - platform: gpio
    pin: GPIO2
    id: backlight_pin
    inverted: true

i2c:
  - sda: GPIO19
    scl: GPIO20
    scan: true
    id: bus_a

interval:
  # The Animation Clock
  - interval: 100ms # Decrease to 50ms to make him walk faster!
    then:
      - animation.next_frame: anim_vault_boy

# --- THE DISPLAY HARDWARE ---
# Notice there is no lambda here anymore! LVGL takes control.
# Size of visible display is 600x480 starting at x=200
display:
  - platform: rpi_dpi_rgb
    id: my_display
    dimensions:
      width: 800
      height: 480
    pclk_frequency: 15MHz
    hsync_pulse_width: 1
    hsync_back_porch: 42
    hsync_front_porch: 20
    vsync_pulse_width: 10
    vsync_back_porch: 12
    vsync_front_porch: 4
    pclk_inverted: true
    color_order: rgb
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    data_pins:
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO1]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]

touchscreen:
  - platform: gt911
    display: my_display
    id: my_touch
    # Explicitly lock in the address we found in your log
    address: 0x5D 
    # Keep the reset pin so it boots cleanly
    reset_pin: GPIO38 
    
    # Notice: interrupt_pin is COMPLETELY GONE. 
    # This forces Polling Mode!
    
    on_touch:
      - lambda: |-
          ESP_LOGI("TOUCH_DEBUG", "RAW TAP: X: %d | Y: %d", touch.x, touch.y);

# =========================================
# GLOBAL COLORS
# =========================================
color:
  - id: pip_bright
    red: 0%
    green: 100%
    blue: 0%
  - id: pip_unselected
    red: 0%
    green: 60%
    blue: 0%
  - id: pip_line 
    red: 0%
    green: 20%
    blue: 0%

# =========================================
# GLOBAL FONTS
# =========================================
font:
  - file: "monofonto.otf"
    id: pip_main_font
    size: 36
    glyphs: 
      - ' !"%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
  - file: "monofonto.otf"
    id: pip_sub_font
    size: 27
    glyphs:
      - ' !"%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
      - 'Σ'

animation:
  - file: "vaultboy_walking.gif"
    id: anim_vault_boy
    type: RGB565

# ==========================================
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  bg_color: 0x000000

  pages:

# ==========================================
    # PAGE 1: THE MAIN PIP-BOY INTERFACE
    # ==========================================
    - id: main_interface
      bg_color: 0x000000
      widgets:
        
        # --- THE PERSISTENT FOOTER (Shifted +192px to the right) ---
        - label:
            text: "HP:"
            x: 240
            y: 445
            text_color: pip_bright
            text_font: pip_main_font
        - label:
            text: "100"
            x: 290
            y: 445
            text_color: pip_bright
            text_font: pip_main_font
            
        - label:
            text: "v-2.0.4-S3"
            # Replaced BOTTOM_MID alignment with an absolute X coordinate 
            # to center it perfectly within the new 608px window
            x: 425 
            y: 450
            text_color: pip_unselected
            text_font: pip_sub_font
            
        - label:
            text: "XP:"
            x: 672
            y: 445
            text_color: pip_bright
            text_font: pip_main_font
        - label:
            text: "0"
            x: 722
            y: 445
            text_color: pip_bright
            text_font: pip_main_font

        # --- THE MAIN TABVIEW (Shifted +192px to the right) ---
        - tabview:
            id: main_tabs
            x: 220
            y: 0
            width: 580
            height: 440 
            bg_color: 0x000000
            tab_style:
              bg_color: 0x000000
              text_color: pip_unselected
              text_font: pip_main_font
              items:
                checked:
                  bg_color: pip_line 
                  text_color: pip_bright
            tabs:
              # --- TAB 1: STAT ---
              - name: "STAT"
                widgets:
                  - roller:
                      x: 10
                      y: 50
                      width: 150
                      options:
                        - STATUS
                        - S.P.E.C.I.A.L.
                        - PERKS
                      visible_row_count: 3
                      text_color: pip_unselected
                      bg_color: 0x000000
                      selected:
                        bg_color: pip_line
                        text_color: pip_bright
                  # ==========================================
                  # ANIMATED VAULT BOY
                  # ==========================================
                  - image:
                      src: anim_vault_boy
                      x: 220
                      y: 80
                  # ==========================================
                  # RAD GAUGE (Stacked Method)
                  # ==========================================
                  - arc:
                      id: lv_arc_6
                      x: 400  #was 450
                      y: 40
                      width: 250
                      height: 250
                      value: 25
                      min_value: 0
                      max_value: 50
                      adjustable: false
                      start_angle: 0
                      end_angle: 180
                      rotation: 90
                      arc_color: pip_line
                      arc_width: 25
                      arc_opa: 100%
                      arc_rounded: false
                      indicator:
                        arc_color: pip_bright
                        arc_width: 25
                      widgets:
                        - label:
                            x: 70
                            y: 100
                            text: "RADS"
                            text_color: pip_bright
                            text_font: pip_sub_font
                        - label:
                            id: lbl_rads
                            x: 80
                            y: 125
                            text: "25"
                            text_color: pip_bright
                            text_font: pip_main_font
              # --- TAB 2: INV ---
              - name: "INV"
                widgets:
                  - bar:
                      x: 550
                      y: 20
                      width: 20
                      height: 200
                      value: 50
                      bg_color: pip_line
                      indicator:
                        bg_color: pip_bright

              # --- TAB 3: DATA (Memory Core) ---
              - name: "DATA"
                widgets:
                  - label:
                      text: "MEMORY CORE REPAIR"
                      x: 150
                      y: 10
                      text_color: pip_bright
                      text_font: pip_main_font
                  - label:
                      text: "TARGET PARITY: 0x1E"
                      x: 180
                      y: 300
                      text_color: pip_unselected
                      text_font: pip_sub_font
                      
                  # 1. THE MAIN PUZZLE GRID
                  - buttonmatrix:
                      id: memory_core_grid
                      x: 40 
                      y: 60
                      width: 380
                      height: 220
                      # --- FLATTENED CASCADING STYLES ---
                      bg_color: 0x000000
                      text_color: pip_bright
                      text_font: pip_main_font
                      border_width: 0
                      rows:
                        - buttons:
                          - text: "00"
                          - text: "0D"
                          - text: "02"
                          - text: "01"
                        - buttons:
                          - text: "0C"
                          - text: "09"
                          - text: "04"
                          - text: "0A"
                        - buttons:
                          - text: "07"
                          - text: "08"
                          - text: "06"
                          - text: "05"
                        - buttons:
                          - text: "0B"
                          - text: "03"
                          - text: "0E"
                          - text: "00"
                      # on_click:
                      #   - lambda: |-
                      #       // 'button_index' automatically outputs 0 through 15
                      #       ESP_LOGI("ROBCO", "Dweller tapped cell index: %d", button_index);
                            
                  # 2. THE MODIFIER GRID (+ / -)
                  - buttonmatrix:
                      id: modifier_grid
                      x: 440
                      y: 60
                      width: 80
                      height: 220
                      one_checked: true 
                      # --- FLATTENED CASCADING STYLES ---
                      bg_color: 0x000000
                      text_color: pip_bright
                      text_font: pip_main_font
                      border_width: 0
                      rows:
                        - buttons:
                          - text: "+"
                        - buttons:
                          - text: "-"
                      # on_click:
                      #   - lambda: |-
                      #       if (button_index == 0) {
                      #         id(input_direction) = 1;  // Plus selected
                      #         ESP_LOGI("ROBCO", "Modifier set to ADD");
                      #       } else {
                      #         id(input_direction) = -1; // Minus selected
                      #         ESP_LOGI("ROBCO", "Modifier set to SUBTRACT");
                      #       }

              # --- TAB 4: MAP ---
              - name: "MAP"
                widgets:
                  - switch:
                      x: 50
                      y: 50
                      width: 60
                      height: 30
                      bg_color: pip_line
                      indicator:
                        bg_color: pip_bright
                      knob:
                        bg_color: pip_bright

    # ==========================================
    # PAGE 2: THE MELTDOWN SEQUENCE (Hidden)
    # ==========================================
    - id: meltdown_screen
      bg_color: 0x330000 # Dark Red Background
      widgets:
        - label:
            text: "CRITICAL ALERT"
            align: CENTER
            y: -40
            text_color: 0xFF0000 # Bright Red
            text_font: pip_main_font
        - label:
            text: "REACTOR MELTDOWN IMMINENT"
            align: CENTER
            y: 20
            text_color: 0xFF0000
            text_font: pip_sub_font
