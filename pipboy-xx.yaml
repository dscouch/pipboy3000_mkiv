# =========================================
# DWELLER IDENTITY & SECRETS
# =========================================
substitutions:

  dweller_id: "527"    # 793 or 612  now with 527
  other_id: "793"
  device_name: "pipboy-${dweller_id}"
  friendly_name: "Vault Dweller ${dweller_id}"
  batt_adc_offset: "-0.068" #612:-0.068 793:???
  scr_align: "TOP_RIGHT"   #if pipboy on left arm: TOP_LEFT, if on right arm: TOP_RIGHT
  
  # Hex Puzzle Arrays
  data_793_grid: &grid793 '{0x0, 0xD, 0x2, 0x1, 0xC, 0x9, 0x4, 0xA, 0x7, 0x8, 0x6, 0x5, 0xB, 0x3, 0xE, 0x0}'
  data_612_grid: &grid612 '{0x0, 0x4, 0xF, 0xE, 0x5, 0x9, 0xD, 0x2, 0xA, 0x6, 0x1, 0x0, 0xB, 0xC, 0x7, 0x8}'
  cell_793_lock: &lock793 '{true, false, false, false, false, true, false, false, false, false, true, false, false, false, false, true}'
  cell_612_lock: &lock612 '{true, false, false, false, false, false, false, true, false, true, false, false, false, false, true, false}'
  
  # ACTIVE DWELLER SELECTOR
  active_grid: *grid612 
  active_lock: *lock612


  # ----------KEEP EVERYTHING ABOVE HERE SEPARATE-------------

  # DWELLER PIP BOY SERIAL NUMS
  # Dweller 793: E793X4
  # Dweller 612: D612Z5

# =============================================================================
# >>> [SYS-INDEX] PIP-BOY SYSTEM INDEX (SEARCH ANCHORS)
#
# >>> [SYS-BOOT] Boot sequence, version banner, initial UI bring-up
# >>> [SYS-HA-CONN] Home Assistant API, encryption, and state sync
#
# >>> [SYS-RAD-UART] Coprocessor UART parsing (RAD / BATRAW)
# >>> [SYS-RAD-SM] Radiation exposure state machine (3-up / 3-down with deadband)
#
# >>> [SYS-DOC-TEXT] Canonical DOC text storage (globals)
# >>> [SYS-DOC-INIT] Initial DOC injection into LVGL widgets
# >>> [SYS-DOC-STATE] Exposure-driven DOC state changes (enter / exit)
# >>> [SYS-DOC-GLITCH] DOC corruption animation during exposure
# >>> [SYS-DOC-RESTORE] DOC restoration after exposure ends
#
# >>> [SYS-UI-STAT] STAT tab: status, SPECIAL, perks, toggles
# >>> [SYS-UI-INV] INV tab: inventory buttons, overlays, puzzle launch
# >>> [SYS-UI-DATA] DATA tab: memory core puzzle and linked cell logic
# >>> [SYS-UI-MAP] MAP tab: page navigation and exposure-gated docs access
#
# >>> [SYS-GAME-HP] HP drain, recovery, death triggers, persistence
# >>> [SYS-GAME-XP] XP tracking and HA override publishing
#
# >>> [SYS-GAME-PUZ] Global puzzle lifecycle (gating, timers, variants, exits)
# >>> [SYS-PUZ-ALPHA] Puzzle Alpha – hardware switch / port logic (shared HA state)
# >>> [SYS-PUZ-BETA] Puzzle Beta – button-based radiation puzzle
# >>> [SYS-PUZ-CHARLIE] Puzzle Charlie – wire-cutting radiation puzzle
# >>> [SYS-PUZ-DELTA] Puzzle Delta – keypad / symbol sequence puzzle
#
# >>> [SYS-DEATH] Cloning / death lifecycle and reboot flow
# >>> [SYS-DIAG] Heap, fragmentation, telemetry, runtime diagnostics
# >>> [SYS-CAL] Calibration and tuning values (thresholds, offsets, fudge)
# =============================================================================


  pip_version: "v2.8.8"

# =========================================
# ESPHOME 
# =========================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.2.4
  name_add_mac_suffix: false
  on_boot:
    priority: 800
    then:
      - output.turn_on: backlight_pin
      - script.execute: robco_boot_sequence
      - lambda: |-
          id(boot_start_time) = millis(); 
          ESP_LOGI("ROBCO", "=============================================");
          ESP_LOGI("ROBCO", " PIP-OS(R) V7.1.0.8 - COPYRIGHT ROBCO IND.");
          ESP_LOGI("ROBCO", " COMPILED FIRMWARE VERSION: %s", "${pip_version}");
          ESP_LOGI("ROBCO", "=============================================");

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 160MHz  # because battery powered. Otherwise default = 240MHZ
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_160: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "65536"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
# =========================================
# HOME ASSISTANT CONNECTION
# =========================================
# (Ensure your secrets.yaml has these defined!)
api:
  reboot_timeout: 0s
  encryption:
    key: !secret pipboy_api_key 

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .home 
  reboot_timeout: 0s

ota:
  - platform: esphome

debug: 
  update_interval: 5s

# =========================================
# OVERSEER CONTROLS (Home Assistant)
# =========================================
number:
  - platform: template
    name: "Scanner Sensitivity Offset"
    id: ha_scanner_fudge
    icon: "mdi:radioactive"
    min_value: -100
    max_value: 100
    step: 5
    initial_value: 0
    optimistic: true
    on_value:
      - lambda: |-
          // When the Overseer adjusts the slider in Home Assistant, 
          // instantly format and transmit the command to the C3 Coprocessor!
          char buffer[20];
          sprintf(buffer, "FUDGE:%d\n", (int)x);
          id(coproc_uart).write_str(buffer);
          ESP_LOGI("OVERSEER", "Remote calibration override broadcasted: %d", (int)x);

  - platform: template
    name: "Pip-Boy XP Override"
    id: ha_xp_control
    icon: "mdi:star-shooting"
    min_value: 0
    max_value: 9999
    step: 1
    # Read the state from the global variable
    lambda: 'return id(vault_xp);'
    update_interval: 2s
    # Handle changes sent from Home Assistant
    set_action:
      - lambda: |-
          id(vault_xp) = x;
          lv_label_set_text_fmt(id(ui_xp_label), "%d", id(vault_xp));
          
          // Confirm the new state to Home Assistant
          id(ha_xp_control).publish_state(x);

# =========================================
# RPG & PUZZLE STATE (GLOBALS)
# =========================================
globals:
  - id: batt_adc_offset
    type: float
    restore_value: yes
    initial_value: ${batt_adc_offset}

# >>> [SYS-BOOT] System initialization flag <<<
  - id: is_booted
    type: bool
    initial_value: 'false'
    restore_value: no

# >>> [SYS-DOC-ACCESS] Manual ownership flags
  - id: has_alpha_beta_docs
    type: bool
    initial_value: 'false'
    restore_value: no

# >>> [SYS-ID] Pip-Boy serial number (used for Manual Override Variant 3)
  - id: pipboy_serial
    type: std::string
    initial_value: ""
    restore_value: no

  # Memory Core Puzzle
  - id: hex_grid
    type: int[16]
    initial_value: ${active_grid}
  - id: locked_cells
    type: bool[16] 
    initial_value: ${active_lock}
  - id: target_sum
    type: int
    initial_value: '30' 
  - id: data_solved
    type: bool
    initial_value: 'false'
    restore_value: no
  - id: input_direction
    type: int
    restore_value: no
    initial_value: '1' # 1 for forward (+), -1 for backward (-)
# >>> [SYS-GAME-PUZ] Tracking value for the remote uplink cell <<<
  - id: mystery_cell_val
    type: int
    initial_value: '0'
    
  # RPG Stats
  - id: vault_xp
    type: int
    initial_value: '0'
    restore_value: yes 
  - id: vault_hp
    type: int
    initial_value: '100'
    restore_value: no 
    
  # Death Stuff
  - id: is_dead
    type: bool
    initial_value: 'false'
    restore_value: yes
  - id: death_countdown
    type: int
    initial_value: '99'
    restore_value: no

  # Reactor Meltdown Status
  - id: meltdown_hold_time
    type: int
    initial_value: '0'
    restore_value: no

  - id: show_boot_screen
    type: bool
    initial_value: 'false'
  - id: boot_start_time
    type: uint32_t
    initial_value: '0'
  - id: boot_step
    type: int
    initial_value: '0'
  - id: boot_buffer
    type: std::string
    initial_value: '""'
# Geiger Counter Settings
  - id: rad_sound_enabled
    type: bool
    initial_value: 'false' # Starts FALSE on boot!
  - id: rad_haptic_enabled
    type: bool
    initial_value: 'false' # Starts FALSE on boot!
  - id: scanner_fudge
    type: int
    initial_value: '0'

# Radiation Smoothing
  - id: consecutive_high_rads
    type: int
    initial_value: '0'
    restore_value: no
  - id: is_exposed
    type: bool
    initial_value: 'false'
    restore_value: no

# >>> [SYS-PUZ-BETA] Long-press latch to prevent click firing after hold
  - id: beta_hold_latched
    type: bool
    initial_value: "false"
    restore_value: no

# Inventory State (Index 0 to 3 for the 4 items)
  - id: inv_found
    type: bool[4]
    initial_value: '{false, false, false, false}'
    restore_value: yes 
  - id: inv_solved
    type: bool[4]
    initial_value: '{false, false, false, false}'
    restore_value: yes 
    
  # Tracks which item puzzle the user is currently looking at
  - id: active_inv_puzzle
    type: int
    initial_value: '0'
    restore_value: no

  # Puzzle Mechanics
  - id: puzzle_is_open
    type: bool
    initial_value: 'false'
    restore_value: no
  - id: active_puzzle_timer
    type: int
    initial_value: '10'
    restore_value: no
  - id: active_puzzle_id
    type: int
    initial_value: '-1'
    restore_value: no
  - id: current_puzzle_seed
    type: int
    initial_value: '0'
    restore_value: no

# >>> [SYS-PUZ-BETA] Beta puzzle state (variant inputs)
  - id: beta_color
    type: int
    initial_value: '0'
    restore_value: no

  - id: beta_label
    type: int
    initial_value: '0'
    restore_value: no

  - id: beta_indicator
    type: int
    initial_value: '0'
    restore_value: no

# >>> [SYS-PUZ-DELTA] State tracking
  - id: delta_variant_id
    type: int
    restore_value: no
    initial_value: '0'

  - id: delta_press_index
    type: int
    restore_value: no
    initial_value: '0'

  - id: delta_expected_order
    type: int[4]
    restore_value: no

  - id: delta_pressed_order
    type: int[4]
    restore_value: no

  - id: delta_last_pressed
    type: int
    restore_value: no

  # >>> [SYS-PUZ-DELTA] Temp result flag for delayed exit
  - id: delta_last_result_ok
    type: bool
    restore_value: no
    initial_value: "false"

  # >>> [SYS-GAME-PUZ] Per-puzzle last seed (prevents repeating the same variant) <<<
  - id: last_puzzle_seed
    type: int[4]
    initial_value: '{-1, -1, -1, -1}'
    restore_value: no

  # >>> [SYS-DOC-ROUTING] Slot render type flags
  - id: doc_slot1_is_delta
    type: bool
    restore_value: no
    initial_value: "false"

  - id: doc_slot2_is_delta
    type: bool
    restore_value: no
    initial_value: "false"

  # >>> [SYS-DOC-TEXT] Original document text (restorable) <<<

  - id: doc_a_text_original
    type: std::string
    initial_value: |
      R"(ROBCO INDUSTRIES - PORT DECRYPTION MANUAL

      Obtain the active serial number from the defuser's device. 

      STEP 3: ALTERNATE PROTOCOLS
      - Port 0x3C: Engage switches 2, 3, and 4.
      - Port 0x4D: Engage switches 1 and 3.)"

# >>> [SYS-DOC-TEXT] Original document text (restorable) <<<
  - id: doc_b_text_original
    type: std::string
    initial_value: |
      R"(ROBCO INDUSTRIES - WIRE DEFUSAL MANUAL

      Inspect the 4 exposed wires and apply the following logic in exact order. Stop at the first rule that applies.
      
      RULE 5: Otherwise, cut the LAST wire.)"

  # >>> [SYS-DOC-TEXT] Original document text (restorable) <<<
  - id: doc_port_manifold
    type: std::string
    initial_value: |
      R"(ROBCO INDUSTRIES
      PORT DECRYPTION MANUAL

      Obtain the active serial number from the defuser's device. 

      STEP 1: FIRST CHARACTER ANALYSIS
      If the serial number begins with a vowel proceed to STEP 3. 
      If the serial number begins with a consonant, proceed to STEP 2.

      STEP 2: TERMINAL DIGIT VERIFICATION
      Inspect the final digit of the serial number. 
      If the digit is even, all switch inputs must be reversed. 
      If the digit is odd, apply standard protocols:
      - Port 0x1A: Enable switches 1 and 4.
      - Port 0x1B: Activate switch 3 only
      - Port 0x2B: Engage switches 2 and 3.
      - Port 0x2C: Activate switches 1 and 2.
      - Port 0x3C: Turn on switches 1, 2, and 3.
      - Port 0x4D: Engage switch 4 only.
      Do not proceed to STEP 3.

      STEP 3: ALTERNATE PROTOCOLS
      - Port 0x1A: Turn on switches 2 and 4.
      - Port 0x1B: Activate switch 4 only
      - Port 0x2B: Engage switch 1 only.
      - Port 0x2C: Activate switches 3 and 4.
      - Port 0x3C: Enable switches 2, 3, and 4.
      - Port 0x4D: Engage switches 1 and 3.)"

  - id: doc_manual_override
    type: std::string
    # The single quotes tell YAML it's a string; the R"(...)" tells C++ it's a string.
    initial_value: |
      R"(ROBCO INDUSTRIES 
      MANUAL OVERRIDE MANUAL
      
      Follow these rules in the order they are listed.
      Perform the first action that applies.
      If instructed to HOLD the button, refer to Releasing a Held Button.
      
      1. If both indicators are lit and the button is WHITE: PRESS immediately.
      2. If the button color is BLUE: PRESS only when the countdown timer shows 3.
      3. If the button says ABORT and exactly one indicator is lit: PRESS. Otherwise HOLD.
      4. If the button color is BLACK: HOLD.
      5. If the button says DETONATE and the button is YELLOW: HOLD.
      6. If the button color is RED and CAR is lit: PRESS. Otherwise HOLD.
      7. If the button color is GREEN and exactly one indicator is lit: HOLD.
      
      RELEASING A HELD BUTTON
      If you are instructed to HOLD the button, observe the strip color and release the button only when the countdown timer shows the correct value.
      Black strip: release when the timer shows 3
      White strip: release when the timer shows 7
      Yellow strip: release when the timer shows 6
      Any other color strip: release when the timer shows 8)"

  - id: doc_signal_bus
    type: std::string
    initial_value: |
      R"(ROBCO INDUSTRIES
      WIRE DEFUSAL MANUAL

      Inspect the 4 exposed wires and apply the following logic in exact order. 
      Stop at the first rule that applies.

      RULE 1: If there are exactly two RED wires, cut the LAST RED wire.
      RULE 2: Otherwise, find the FIRST DIGIT in the defusers serial number. 
      If that digit is EVEN, and there is a YELLOW wire, cut the FIRST wire.
      RULE 3: Otherwise, if there are NO BLUE wires, cut the SECOND wire.
      RULE 4: Otherwise, if the last wire is WHITE, cut the THIRD wire.
      RULE 5: Otherwise, cut the LAST wire.)"

  - id: doc_auth_lattice
    type: std::string
    initial_value: |
      R"(ROBCO INDUSTRIES
      AUTH LATTICE MANUAL

      Only one column below contains all four symbols from the keypad.
      Press the four buttons in the order their symbols appear
      from top to bottom within that column.)"

# >>> [SYS-DOC-DELTA] Canonical Delta manual content
  - id: delta_col_0_original
    type: std::string
    restore_value: no

  - id: delta_col_1_original
    type: std::string
    restore_value: no

  - id: delta_col_2_original
    type: std::string
    restore_value: no

  - id: delta_col_3_original
    type: std::string
    restore_value: no

  - id: delta_col_4_original
    type: std::string
    restore_value: no

  - id: delta_col_5_original
    type: std::string
    restore_value: no

# =========================================
# HARDWARE & BUSES
# =========================================
output:
  - platform: gpio
    pin: GPIO2
    id: backlight_pin
    inverted: true

i2c:
  - sda: GPIO19
    scl: GPIO20
    scan: true
    id: bus_a

# The Coprocessor UART Bus ====================================================
uart:
  id: coproc_uart
  tx_pin: GPIO43
  rx_pin: GPIO44  
  baud_rate: 9600

# =========================================
# NFC READER (I2C)
# =========================================
pn532_i2c:
  id: nfc_reader
  i2c_id: bus_a
  address: 0x24  
  update_interval: 1s
  on_tag:
    then:
      - lambda: |-
          std::string uid = x;
          int scanned_id = -1;

          ESP_LOGI("ROBCO", "=== NFC TRIGGER PULLED ===");
          ESP_LOGI("ROBCO", "Raw string from scanner: '%s'", uid.c_str());

          if (uid == "04-63-eb-5b-c2-2a-81" || uid == "04-63-EB-5B-C2-2A-81") scanned_id = 0;
          else if (uid == "04-21-75-94-d2-2a-81" || uid == "04-21-75-94-D2-2A-81") scanned_id = 1;
          else if (uid == "04-fa-f4-94-d2-2a-81" || uid == "04-FA-F4-94-D2-2A-81") scanned_id = 2;
          else if (uid == "04-a9-75-5b-c2-2a-81" || uid == "04-A9-75-5B-C2-2A-81") scanned_id = 3;

          ESP_LOGI("ROBCO", "Mapped to Puzzle ID: %d", scanned_id);
            if (scanned_id != -1) {
              bool is_solved = false;
              if (scanned_id == 0) {
                is_solved = id(ha_solved_alpha).state;
              } else {
                is_solved = id(inv_solved)[scanned_id];
              }
            ESP_LOGI("ROBCO", "Is it already solved? %s", is_solved ? "YES" : "NO");

            if (!is_solved) {
              
              if (id(puzzle_is_open) && id(active_puzzle_id) == scanned_id) {
                id(active_puzzle_timer) = 10;
                ESP_LOGI("ROBCO", "Action: Timer reset!");
              
              } else if (id(ha_cheat_mode).state || id(is_exposed)) {

                // >>> [SYS-GAME-PUZ] Ensure previous puzzle is fully closed <<<
                id(puzzle_ui_close).execute();

                ESP_LOGI("ROBCO", "Action: Opening puzzle interface...");
                lv_tabview_set_act(id(main_tabs), 1, LV_ANIM_OFF);

                id(active_puzzle_id) = scanned_id;
                id(active_puzzle_timer) = 10;
                id(puzzle_is_open) = true;

                // >>> [SYS-GAME-PUZ] Pick new puzzle variant (no repeat) <<<
                id(puzzle_pick_new_seed).execute(scanned_id, 4);

                // >>> [SYS-GAME-PUZ] Puzzle-specific preparation <<<
                // >>> [SYS-PUZ-ALPHA] Show Alpha + render current variant inputs <<< ------------------------------------ALPHA
                if (scanned_id == 0) {
                  // Ensure Alpha container is visible (already done, but safe)
                  lv_obj_clear_flag(id(puzzle_alpha_container), LV_OBJ_FLAG_HIDDEN);

                  // Reset the 4 switches
                  lv_obj_clear_state(id(sw_alpha_1), LV_STATE_CHECKED);
                  lv_obj_clear_state(id(sw_alpha_2), LV_STATE_CHECKED);
                  lv_obj_clear_state(id(sw_alpha_3), LV_STATE_CHECKED);
                  lv_obj_clear_state(id(sw_alpha_4), LV_STATE_CHECKED);

                  // Set the hint based on the chosen seed
                  if (id(current_puzzle_seed) == 0) lv_label_set_text(id(alpha_hint_label), "PORT: 0x1A");
                  else if (id(current_puzzle_seed) == 1) lv_label_set_text(id(alpha_hint_label), "PORT: 0x2B");
                  else if (id(current_puzzle_seed) == 2) lv_label_set_text(id(alpha_hint_label), "PORT: 0x3C");
                  else if (id(current_puzzle_seed) == 3) lv_label_set_text(id(alpha_hint_label), "PORT: 0x4D");

                } else if (scanned_id == 1) {
                  // >>> [SYS-PUZ-BETA] Show Beta + render current variant inputs <<< ------------------------------------BETA
                  lv_obj_clear_flag(id(puzzle_beta_container), LV_OBJ_FLAG_HIDDEN);

                  // >>> [SYS-PUZ-BETA] Apply seed-driven UI state <<<
                  //id(manual_override_apply_seed).execute();

                  const int seed = id(current_puzzle_seed);

                  // --- helper: indicator LED (green outline always; fill green when ON) ---
                  auto set_led = [&](lv_obj_t *led, bool on) {
                    lv_obj_set_style_border_color(led, lv_color_hex(0x00FF00), 0);
                    lv_obj_set_style_border_width(led, 2, 0);
                    lv_obj_set_style_bg_color(led, on ? lv_color_hex(0x00FF00) : lv_color_hex(0x000000), 0);
                  };

                  // --- helper: main button style (Pip-Boy theme) ---
                  // Always green border + green text; only bg changes.
                  auto set_button_theme = [&](lv_obj_t *btn, lv_obj_t *lbl, uint32_t bg_hex) {
                    lv_obj_set_style_border_width(btn, 2, 0);
                    lv_obj_set_style_border_color(btn, lv_color_hex(0x00FF00), 0);
                    lv_obj_set_style_bg_color(btn, lv_color_hex(bg_hex), 0);

                    // Keep label explicitly green (avoids theme inheritance surprises)
                    lv_obj_set_style_text_color(lbl, lv_color_hex(0x00FF00), 0);
                  };

                  // --- helper: strip style (Pip-Boy theme) ---
                  // Always green border; bg changes when visible.
                  auto set_strip = [&](lv_obj_t *strip, bool show, uint32_t bg_hex) {
                    if (show) {
                      lv_obj_clear_flag(strip, LV_OBJ_FLAG_HIDDEN);
                      lv_obj_set_style_border_width(strip, 2, 0);
                      lv_obj_set_style_border_color(strip, lv_color_hex(0x00FF00), 0);
                      lv_obj_set_style_bg_color(strip, lv_color_hex(bg_hex), 0);
                    } else {
                      lv_obj_add_flag(strip, LV_OBJ_FLAG_HIDDEN);
                      lv_obj_set_style_bg_color(strip, lv_color_hex(0x000000), 0);
                    }
                  };

                  // Muted “recognizable” palette (not eye-popping)
                  const uint32_t BG_YELLOW = 0x333300;  // muted yellow
                  const uint32_t BG_RED    = 0x660000;  // muted red (your example)
                  const uint32_t BG_BLUE   = 0x000033;  // muted blue
                  const uint32_t BG_BLACK  = 0x000000;  // true black
                  const uint32_t STRIP_BLUE  = 0x000066; // stronger muted blue
                  const uint32_t STRIP_WHITE = 0x444444; // “white-ish” gray for visibility

                  // Defaults
                  set_led(id(beta_ind_car), false);
                  set_led(id(beta_ind_frk), false);
                  set_strip(id(beta_strip), false, 0x000000);
                  set_button_theme(id(beta_main_button), id(beta_main_button_label), 0x000000);

                  // =========================
                  // Seed mapping (LOCKED)
                  // =========================

                  // Seed 0: ABORT, yellow, CAR+FRK lit, HOLD, blue strip, release on 8
                  if (seed == 0) {
                    lv_label_set_text(id(beta_main_button_label), "ABORT");
                    set_button_theme(id(beta_main_button), id(beta_main_button_label), BG_YELLOW);
                    set_led(id(beta_ind_car), true);
                    set_led(id(beta_ind_frk), true);
                    set_strip(id(beta_strip), false, STRIP_BLUE);
                    //lv_label_set_text(id(beta_debug_label), "SEED:0  HOLD  REL:8");
                  }

                  // Seed 1: DETONATE, red, CAR lit, PRESS
                  else if (seed == 1) {
                    lv_label_set_text(id(beta_main_button_label), "DETONATE");
                    set_button_theme(id(beta_main_button), id(beta_main_button_label), BG_RED);
                    set_led(id(beta_ind_car), true);
                    set_led(id(beta_ind_frk), false);
                    set_strip(id(beta_strip), false, 0x000000);
                    //lv_label_set_text(id(beta_debug_label), "SEED:1  PRESS");
                  }

                  // Seed 2: HOLD, blue, PRESS when timer shows 3
                  else if (seed == 2) {
                    lv_label_set_text(id(beta_main_button_label), "HOLD");
                    set_button_theme(id(beta_main_button), id(beta_main_button_label), BG_BLUE);
                    set_led(id(beta_ind_car), false);
                    set_led(id(beta_ind_frk), false);
                    set_strip(id(beta_strip), false, 0x000000);
                    //lv_label_set_text(id(beta_debug_label), "SEED:2  PRESS@3");
                  }

                  // Seed 3: PRESS, black, HOLD, white strip, release on 7
                  else if (seed == 3) {
                    lv_label_set_text(id(beta_main_button_label), "PRESS");
                    set_button_theme(id(beta_main_button), id(beta_main_button_label), BG_BLACK);
                    set_led(id(beta_ind_car), false);
                    set_led(id(beta_ind_frk), false);
                    set_strip(id(beta_strip), false, STRIP_WHITE);
                    //lv_label_set_text(id(beta_debug_label), "SEED:3  HOLD  REL:7");
                  }

                  else {
                    lv_label_set_text(id(beta_main_button_label), "ERROR");
                    set_button_theme(id(beta_main_button), id(beta_main_button_label), 0x000000);
                    //lv_label_set_text(id(beta_debug_label), "SEED:UNKNOWN");
                  }

                } else if (scanned_id == 2) {
                  // >>> [SYS-PUZ-CHARLIE] Show Charlie + render current variant inputs <<< ------------------------------------CHARLIE
                  lv_obj_clear_flag(id(puzzle_charlie_container), LV_OBJ_FLAG_HIDDEN);
                  
                  // Load the specific wire colours based on the seed
                  int seed = id(current_puzzle_seed);
                  int w[4];
                  
                  // 0=Red, 1=Blue, 2=Yellow, 3=Green, 4=White
                  if (seed == 0) { w[0]=0; w[1]=1; w[2]=0; w[3]=2; }      // R, B, R, Y
                  else if (seed == 1) { w[0]=3; w[1]=2; w[2]=1; w[3]=4; } // G, Y, B, W
                  else if (seed == 2) { w[0]=4; w[1]=0; w[2]=1; w[3]=3; } // W, R, B, G
                  else if (seed == 3) { w[0]=3; w[1]=4; w[2]=0; w[3]=3; } // G, W, R, G
                  
                  lv_obj_t* wires[4] = {id(btn_wire_0), id(btn_wire_1), id(btn_wire_2), id(btn_wire_3)};
                  uint32_t colors[5] = {0xCC0000, 0x0000CC, 0xCCCC00, 0x00CC00, 0xCCCCCC};
                  
                  // Paint the buttons
                  for(int i = 0; i < 4; i++) {
                    lv_obj_set_style_bg_color(wires[i], lv_color_hex(colors[w[i]]), 0);
                  }

                } else if (scanned_id == 3) {
                  // >>> [SYS-PUZ-DELTA] Show Delta + render current variant inputs <<< ------------------------------------DELTA
                  lv_obj_clear_flag(id(puzzle_delta_container), LV_OBJ_FLAG_HIDDEN);
                  id(delta_init_variant).execute();
                }

                ESP_LOGI("ROBCO", "Puzzle opened. Generated Seed: %d", id(current_puzzle_seed));
                lv_obj_clear_flag(id(inv_puzzle_overlay), LV_OBJ_FLAG_HIDDEN);
                
              } else {
                ESP_LOGW("ROBCO", "Action: Denied (Radiation too low)");
              }
            }
            // >>> [SYS-GAME-PUZ] Solved puzzle scan feedback (popup, no overlay) <<<
            if (is_solved) {
              ESP_LOGI("ROBCO", "Action: Solved cache scanned -> showing solved popup");
              id(solved_cache_popup).execute();
              return;
            }
          } else {
            ESP_LOGW("ROBCO", "Error: Unrecognized Tag ID.");
          }

# --- THE DISPLAY HARDWARE ---
# Size of visible display is 600x480 starting at x=0
display:
  - platform: mipi_rgb
    model: RPI
    id: my_display
    dimensions:
      width: 800
      height: 480
    pclk_frequency: 15MHz
    hsync_pulse_width: 1
    hsync_back_porch: 42
    hsync_front_porch: 20
    vsync_pulse_width: 10
    vsync_back_porch: 12
    vsync_front_porch: 4
    pclk_inverted: true
    color_order: rgb
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    data_pins:
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO1]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]

touchscreen:
  - platform: gt911
    display: my_display
    id: my_touch
    # Explicitly lock in the address we found in your log
    address: 0x5D 
    # Keep the reset pin so it boots cleanly
    reset_pin: GPIO38 
   
    on_touch:
      - lambda: |-
          ESP_LOGI("TOUCH_DEBUG", "RAW TAP: X: %d | Y: %d", touch.x, touch.y);

