                              lv_obj_clear_flag(id(inv_puzzle_overlay), LV_OBJ_FLAG_HIDDEN);
                            }

# --- INVENTORY PUZZLE OVERLAY ---
                  - obj:
                      id: inv_puzzle_overlay
                      x: 10
                      y: 50
                      width: 580
                      height: 380
                      bg_color: 0x000000
                      border_width: 2
                      border_color: pip_bright
                      hidden: true
                      widgets:
                        - label:
                            text: "DECRYPTION REQUIRED"
                            x: 140
                            y: 20
                            
                        # THE COUNTDOWN TIMER (This fixes your compiler error!)
                        - label:
                            id: lbl_puzzle_timer
                            text: "00:10"
                            x: 240
                            y: 60
                            text_color: pip_alert
                            text_font: pip_main_font

                        # ==========================================
                        # CACHE ALPHA: HARDWARE BYPASS PUZZLE
                        # ==========================================
                        - obj:
                            id: puzzle_alpha_container
                            x: 10
                            y: 100
                            width: 560
                            height: 260
                            bg_color: 0x000000
                            border_width: 0
                            hidden: true 
                            widgets:
                              - label:
                                  id: alpha_hint_label
                                  text: "PORT: 0x00"
                                  x: 220
                                  y: 10
                              
                              # THE 4 HARDWARE SWITCHES
                              - switch: { id: sw_alpha_1, x: 80, y: 70, width: 60, height: 30 }
                              - switch: { id: sw_alpha_2, x: 200, y: 70, width: 60, height: 30 }
                              - switch: { id: sw_alpha_3, x: 320, y: 70, width: 60, height: 30 }
                              - switch: { id: sw_alpha_4, x: 440, y: 70, width: 60, height: 30 }
                              
                              # NUMBER LABELS FOR THE SWITCHES
                              - label: { text: "1", x: 100, y: 110, text_font: pip_sub_font }
                              - label: { text: "2", x: 220, y: 110, text_font: pip_sub_font }
                              - label: { text: "3", x: 340, y: 110, text_font: pip_sub_font }
                              - label: { text: "4", x: 460, y: 110, text_font: pip_sub_font }

                              # THE SUBMIT BUTTON
                              - button:
                                  id: btn_alpha_decrypt
                                  x: 200
                                  y: 170
                                  width: 160
                                  height: 60
                                  widgets:
                                    - label: { text: "DECRYPT", align: CENTER }
                                    on_click:
                                    - lambda: |-
                                        // Read the current state of all 4 switches
                                        bool s1 = lv_obj_has_state(id(sw_alpha_1), LV_STATE_CHECKED);
                                        bool s2 = lv_obj_has_state(id(sw_alpha_2), LV_STATE_CHECKED);
                                        bool s3 = lv_obj_has_state(id(sw_alpha_3), LV_STATE_CHECKED);
                                        bool s4 = lv_obj_has_state(id(sw_alpha_4), LV_STATE_CHECKED);
                                        
                                        bool is_correct = false;
                                        int seed = id(current_puzzle_seed);
                                        
                                        // THE RULES (The other player needs these in their manual!)
                                        // Seed 0 (0x1A): Switches 1 and 4 must be ON.
                                        if (seed == 0 && s1 && !s2 && !s3 && s4) is_correct = true;
                                        
                                        // Seed 1 (0x2B): Switches 2 and 3 must be ON.
                                        else if (seed == 1 && !s1 && s2 && s3 && !s4) is_correct = true;
                                        
                                        // Seed 2 (0x3C): Switches 1, 2, and 3 must be ON.
                                        else if (seed == 2 && s1 && s2 && s3 && !s4) is_correct = true;
                                        
                                        // Seed 3 (0x4D): Only Switch 4 must be ON.
                                        else if (seed == 3 && !s1 && !s2 && !s3 && s4) is_correct = true;

                                        if (is_correct) {
                                          ESP_LOGI("ROBCO", "Cache Alpha Decrypted!");
                                          id(inv_solved)[0] = true;
                                          id(puzzle_is_open) = false;
                                          
                                          // Update the inventory screen button
                                          lv_label_set_text(id(lbl_inv_0), "DEC: 7A 9F 22 B1");
                                          
                                          // Hide the overlay and puzzle
                                          lv_obj_add_flag(id(puzzle_alpha_container), LV_OBJ_FLAG_HIDDEN);
                                          lv_obj_add_flag(id(inv_puzzle_overlay), LV_OBJ_FLAG_HIDDEN);
                                          
                                          // Award XP!
                                          id(add_xp).execute(50);
                                          
                                        } else {
                                          // THEY GUESSED WRONG! Trigger the penalty.
                                          id(puzzle_failed_penalty).execute();
                                        }

              # --- TAB 3: DATA (Memory Core) ---
              - name: "DATA"
                # Kill scrollbars on this specific page too
