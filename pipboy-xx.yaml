# =========================================
# DWELLER IDENTITY & SECRETS
# =========================================
substitutions:
  pip_version: "v2.4.8"
  dweller_id: "793"    # 793 or 612
  other_id: "612"
  device_name: "pipboy-${dweller_id}"
  friendly_name: "Vault Dweller ${dweller_id}"
  
  # Hex Puzzle Arrays
  data_793_grid: &grid793 '{0x0, 0xD, 0x2, 0x1, 0xC, 0x9, 0x4, 0xA, 0x7, 0x8, 0x6, 0x5, 0xB, 0x3, 0xE, 0x0}'
  data_612_grid: &grid612 '{0x0, 0x4, 0xF, 0xE, 0x5, 0x9, 0xD, 0x2, 0xA, 0x6, 0x1, 0x0, 0xB, 0xC, 0x7, 0x8}'
  cell_793_lock: &lock793 '{true, false, false, false, false, true, false, false, false, false, true, false, false, false, false, true}'
  cell_612_lock: &lock612 '{true, false, false, false, false, false, false, true, false, true, false, false, false, false, true, false}'
  
  # ACTIVE DWELLER SELECTOR
  active_grid: *grid793 
  active_lock: *lock793

  # DWELLER PIP BOY SERIAL NUMS
  # Dweller 793: E793X4
  # Dweller 612: D612Z5


# =========================================
# ESPHOME 
# =========================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.2.4
  name_add_mac_suffix: false
  on_boot:
    priority: 800
    then:
      - output.turn_on: backlight_pin
      - script.execute: robco_boot_sequence
      - lambda: |-
          id(boot_start_time) = millis(); 
          ESP_LOGI("ROBCO", "=============================================");
          ESP_LOGI("ROBCO", " PIP-OS(R) V7.1.0.8 - COPYRIGHT ROBCO IND.");
          ESP_LOGI("ROBCO", " COMPILED FIRMWARE VERSION: %s", "${pip_version}");
          ESP_LOGI("ROBCO", "=============================================");

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  # This is the ONE and ONLY place this command is allowed to exist
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
     
psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
# =========================================
# HOME ASSISTANT CONNECTION
# =========================================
# (Ensure your secrets.yaml has these defined!)
api:
  encryption:
    key: !secret pipboy_api_key 

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .home 

ota:
  - platform: esphome

debug: 
  update_interval: 5s

# =========================================
# OVERSEER CONTROLS (Home Assistant)
# =========================================
number:
  - platform: template
    name: "Scanner Sensitivity Offset"
    id: ha_scanner_fudge
    icon: "mdi:radioactive"
    min_value: -100
    max_value: 100
    step: 5
    initial_value: 0
    optimistic: true
    on_value:
      - lambda: |-
          // When the Overseer adjusts the slider in Home Assistant, 
          // instantly format and transmit the command to the C3 Coprocessor!
          char buffer[20];
          sprintf(buffer, "FUDGE:%d\n", (int)x);
          id(coproc_uart).write_str(buffer);
          ESP_LOGI("OVERSEER", "Remote calibration override broadcasted: %d", (int)x);

  - platform: template
    name: "Pip-Boy XP Override"
    id: ha_xp_control
    icon: "mdi:star-shooting"
    min_value: 0
    max_value: 9999
    step: 1
    # Read the state from the global variable
    lambda: 'return id(vault_xp);'
    update_interval: 2s
    # Handle changes sent from Home Assistant
    set_action:
      - lambda: |-
          id(vault_xp) = x;
          lv_label_set_text_fmt(id(ui_xp_label), "%d", id(vault_xp));
          
          // Confirm the new state to Home Assistant
          id(ha_xp_control).publish_state(x);

# =========================================
# RPG & PUZZLE STATE (GLOBALS)
# =========================================
globals:
  # Memory Core Puzzle
  - id: hex_grid
    type: int[16]
    initial_value: ${active_grid}
  - id: locked_cells
    type: bool[16] 
    initial_value: ${active_lock}
  - id: target_sum
    type: int
    initial_value: '30' 
  - id: data_solved
    type: bool
    initial_value: 'false'
    restore_value: no
  - id: input_direction
    type: int
    restore_value: no
    initial_value: '1' # 1 for forward (+), -1 for backward (-)
    
  # RPG Stats
  - id: vault_xp
    type: int
    initial_value: '0'
    restore_value: yes 
  - id: vault_hp
    type: int
    initial_value: '100'
    restore_value: yes 
    
  # Reactor Meltdown Status
  - id: meltdown_hold_time
    type: int
    initial_value: '0'
    restore_value: no

  - id: show_boot_screen
    type: bool
    initial_value: 'false'
  - id: boot_start_time
    type: uint32_t
    initial_value: '0'
  - id: boot_step
    type: int
    initial_value: '0'
  - id: boot_buffer
    type: std::string
    initial_value: '""'
# Geiger Counter Settings
  - id: rad_sound_enabled
    type: bool
    initial_value: 'false' # Starts FALSE on boot!
  - id: rad_haptic_enabled
    type: bool
    initial_value: 'false' # Starts FALSE on boot!
  - id: scanner_fudge
    type: int
    initial_value: '0'

# Radiation Smoothing
  - id: consecutive_high_rads
    type: int
    initial_value: '0'
    restore_value: no
  - id: is_exposed
    type: bool
    initial_value: 'false'
    restore_value: no

# Inventory State (Index 0 to 3 for the 4 items)
  - id: inv_found
    type: bool[4]
    initial_value: '{false, false, false, false}'
    restore_value: yes 
  - id: inv_solved
    type: bool[4]
    initial_value: '{false, false, false, false}'
    restore_value: yes 
    
  # Tracks which item puzzle the user is currently looking at
  - id: active_inv_puzzle
    type: int
    initial_value: '0'
    restore_value: no

  # Puzzle Mechanics
  - id: puzzle_is_open
    type: bool
    initial_value: 'false'
    restore_value: no
  - id: active_puzzle_timer
    type: int
    initial_value: '10'
    restore_value: no
  - id: active_puzzle_id
    type: int
    initial_value: '-1'
    restore_value: no


# =========================================
# HARDWARE & BUSES
# =========================================
output:
  - platform: gpio
    pin: GPIO2
    id: backlight_pin
    inverted: true

i2c:
  - sda: GPIO19
    scl: GPIO20
    scan: true
    id: bus_a

# The Coprocessor UART Bus ====================================================
uart:
  id: coproc_uart
  tx_pin: GPIO43
  rx_pin: GPIO44  
  baud_rate: 9600

# =========================================
# NFC READER (I2C)
# =========================================
pn532_i2c:
  id: nfc_reader
  i2c_id: bus_a
  address: 0x24  
  update_interval: 1s
  on_tag:
    then:
      - lambda: |-
          // Capture the scanned ID as a string
          std::string uid = x;
          ESP_LOGD("NFC", "Tag Scanned: %s", uid.c_str());

          // --- CACHE ALPHA ---
          if (uid == "04-63-EB-5B-C2-2A-81") { 
            if (!id(inv_solved)[0]) {
              
              if (id(puzzle_is_open) && id(active_puzzle_id) == 0) {
                // Condition 1: Puzzle is already open. Reset the timer!
                id(active_puzzle_timer) = 10;
                ESP_LOGI("ROBCO", "Timer reset for Cache Alpha.");
                
              } else if (id(is_exposed)) {
                // Condition 2: Player is exposed to radiation. Open the puzzle!
                id(active_puzzle_id) = 0;
                id(active_puzzle_timer) = 10;
                id(puzzle_is_open) = true;
                id(current_puzzle_seed) = esp_random() % 4; 
                
                // --- PREPARE CACHE ALPHA ---
                if (scanned_id == 0) {
                  // Show the Alpha puzzle container
                  lv_obj_clear_flag(id(puzzle_alpha_container), LV_OBJ_FLAG_HIDDEN);
                  
                  // Reset all switches to OFF
                  lv_obj_clear_state(id(sw_alpha_1), LV_STATE_CHECKED);
                  lv_obj_clear_state(id(sw_alpha_2), LV_STATE_CHECKED);
                  lv_obj_clear_state(id(sw_alpha_3), LV_STATE_CHECKED);
                  lv_obj_clear_state(id(sw_alpha_4), LV_STATE_CHECKED);
                  
                  // Set the port text based on the random seed
                  if (id(current_puzzle_seed) == 0) lv_label_set_text(id(alpha_hint_label), "PORT: 0x1A");
                  else if (id(current_puzzle_seed) == 1) lv_label_set_text(id(alpha_hint_label), "PORT: 0x2B");
                  else if (id(current_puzzle_seed) == 2) lv_label_set_text(id(alpha_hint_label), "PORT: 0x3C");
                  else if (id(current_puzzle_seed) == 3) lv_label_set_text(id(alpha_hint_label), "PORT: 0x4D");
                }
              
              lv_obj_clear_flag(id(inv_puzzle_overlay), LV_OBJ_FLAG_HIDDEN);
                
                lv_obj_clear_flag(id(inv_puzzle_overlay), LV_OBJ_FLAG_HIDDEN);
                ESP_LOGI("ROBCO", "Puzzle Alpha opened.");
              }
            }
          }
          // --- CACHE BETA ---
          else if (uid == "04-21-75-94-D2-2A-81" && !id(inv_found)[1]) {
            if (!id(inv_solved)[1]) {
              
              if (id(puzzle_is_open) && id(active_puzzle_id) == 1) {
                // Condition 1: Puzzle is already open. Reset the timer!
                id(active_puzzle_timer) = 10;
                ESP_LOGI("ROBCO", "Timer reset for Cache Beta.");
                
              } else if (id(is_exposed)) {
                // Condition 2: Player is exposed to radiation. Open the puzzle!
                id(active_puzzle_id) = 1;
                id(active_puzzle_timer) = 10;
                id(puzzle_is_open) = true;
                
                // (We will add the code here to randomize the puzzle parameters later)
                
                lv_obj_clear_flag(id(inv_puzzle_overlay), LV_OBJ_FLAG_HIDDEN);
                ESP_LOGI("ROBCO", "Puzzle Beta opened.");
              }
            }
          }
          // --- CACHE CHARLIE ---
          else if (uid == "04-FA-F4-94-D2-2A-81" && !id(inv_found)[2]) {
            if (!id(inv_solved)[2]) {
              
              if (id(puzzle_is_open) && id(active_puzzle_id) == 2) {
                // Condition 1: Puzzle is already open. Reset the timer!
                id(active_puzzle_timer) = 10;
                ESP_LOGI("ROBCO", "Timer reset for Cache Charlie.");
                
              } else if (id(is_exposed)) {
                // Condition 2: Player is exposed to radiation. Open the puzzle!
                id(active_puzzle_id) = 2;
                id(active_puzzle_timer) = 10;
                id(puzzle_is_open) = true;
                
                // (We will add the code here to randomize the puzzle parameters later)
                
                lv_obj_clear_flag(id(inv_puzzle_overlay), LV_OBJ_FLAG_HIDDEN);
                ESP_LOGI("ROBCO", "Puzzle Charlie opened.");
              }
            }
          }
          // --- CACHE DELTA ---
          else if (uid == "04-A9-75-5B-C2-2A-81" && !id(inv_found)[3]) {
            if (!id(inv_solved)[3]) {
              
              if (id(puzzle_is_open) && id(active_puzzle_id) == 3) {
                // Condition 1: Puzzle is already open. Reset the timer!
                id(active_puzzle_timer) = 10;
                ESP_LOGI("ROBCO", "Timer reset for Cache Delta.");
                
              } else if (id(is_exposed)) {
                // Condition 2: Player is exposed to radiation. Open the puzzle!
                id(active_puzzle_id) = 3;
                id(active_puzzle_timer) = 10;
                id(puzzle_is_open) = true;
                
                // (We will add the code here to randomize the puzzle parameters later)
                
                lv_obj_clear_flag(id(inv_puzzle_overlay), LV_OBJ_FLAG_HIDDEN);
                ESP_LOGI("ROBCO", "Puzzle Delta opened.");
              }
            }
          }

# --- THE DISPLAY HARDWARE ---
# Notice there is no lambda here anymore! LVGL takes control.
# Size of visible display is 600x480 starting at x=200
display:
  - platform: rpi_dpi_rgb
    id: my_display
    dimensions:
      width: 800
      height: 480
    pclk_frequency: 15MHz
    hsync_pulse_width: 1
    hsync_back_porch: 42
    hsync_front_porch: 20
    vsync_pulse_width: 10
    vsync_back_porch: 12
    vsync_front_porch: 4
    pclk_inverted: true
    color_order: rgb
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    data_pins:
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO1]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]

touchscreen:
  - platform: gt911
    display: my_display
    id: my_touch
    # Explicitly lock in the address we found in your log
    address: 0x5D 
    # Keep the reset pin so it boots cleanly
    reset_pin: GPIO38 
    
    # Notice: interrupt_pin is COMPLETELY GONE. 
    # This forces Polling Mode!
    
    on_touch:
      - lambda: |-
          ESP_LOGI("TOUCH_DEBUG", "RAW TAP: X: %d | Y: %d", touch.x, touch.y);



