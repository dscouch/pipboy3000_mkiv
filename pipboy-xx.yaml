                      scrollable: true  # Enabled scrolling for text docs!
                      scrollbar_mode: "AUTO"
                      widgets:
                        - label:
                            id: doc_a_text
                            text: "AWAITING KTANE UPLINK..."
                            x: 5
                            y: 5
