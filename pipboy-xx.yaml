# Vault 27 Dweller XX Pip-boy yaml - S3 High-Res Edition
substitutions:
  pip_version: "v2.0.0-S3"
  dweller_id: "793"    #793 or 612
  other_id: "612"
  device_name: "pipboy-${dweller_id}"
  friendly_name: "Vault Dweller ${dweller_id}"
  
  data_793_grid: &grid793 '{0x0, 0xD, 0x2, 0x1, 0xC, 0x9, 0x4, 0xA, 0x7, 0x8, 0x6, 0x5, 0xB, 0x3, 0xE, 0x0}'
  data_612_grid: &grid612 '{0x0, 0x4, 0xF, 0xE, 0x5, 0x9, 0xD, 0x2, 0xA, 0x6, 0x1, 0x0, 0xB, 0xC, 0x7, 0x8}'
  cell_793_lock: &lock793 '{true, false, false, false, false, true, false, false, false, false, true, false, false, false, false, true}'
  cell_612_lock: &lock612 '{true, false, false, false, false, false, false, true, false, true, false, false, false, false, true, false}'
  
  active_grid: *grid793 
  active_lock: *lock793

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.2.4
  name_add_mac_suffix: false
  on_boot:
    priority: 800
    then:
      - output.turn_on: backlight_pin
      - lambda: |-
          id(boot_start_time) = millis(); 
          ESP_LOGI("ROBCO", "=============================================");
          ESP_LOGI("ROBCO", " PIP-OS(R) V7.1.0.8 - COPYRIGHT ROBCO IND.");
          ESP_LOGI("ROBCO", " COMPILED FIRMWARE VERSION: %s", "${pip_version}");
          ESP_LOGI("ROBCO", "=============================================");

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret pipboy_api_key 

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .home 

# =========================================
# HARDWARE & BUSES
# =========================================
output:
  - platform: gpio
    pin: GPIO2
    id: backlight_pin
    inverted: true

i2c:
  - sda: GPIO19
    scl: GPIO20
    scan: true
    id: bus_a

# The Coprocessor UART Bus 
# (Pins mapped to available headers since the S3 Edge pins changed)
uart:
  id: uart_coproc
  tx_pin: GPIO10  # Recommend using SD-Card or unused pins
  rx_pin: GPIO11  
  baud_rate: 9600

# =========================================
# ASSETS (SCALED FOR 5-INCH)
# =========================================
font:
  - file: "monofonto.otf"
    id: pip_main_font
    size: 48 # Doubled from 24
    glyphs: 
      - ' !"%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
  - file: "monofonto.otf"
    id: pip_sub_font
    size: 36 # Doubled from 18
    glyphs:
      - ' !"%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
      - 'Σ'

color:
  - id: pip_bright
    red: 0%
    green: 100%
    blue: 0%
  - id: pip_unselected
    red: 0%
    green: 60%
    blue: 0%
  - id: pip_line 
    red: 0%
    green: 20%
    blue: 0%
  - id: pip_alert
    red: 0%
    green: 0%
    blue: 100%

# =========================================
# MEMORY & GLOBALS (Unchanged from your file)
# =========================================
globals:
  - id: show_boot_screen
    type: bool
    initial_value: 'true'
  - id: boot_start_time
    type: uint32_t
    initial_value: '0'
  - id: active_main_tab
    type: int
    initial_value: '0' 
  - id: active_sub_tab
    type: int
    initial_value: '0' 
  - id: hex_grid
    type: int[16]
    initial_value: ${active_grid}
  - id: locked_cells
    type: bool[16] 
    initial_value: ${active_lock}
  - id: target_sum
    type: int
    initial_value: '30' 
  - id: data_solved
    type: bool
    initial_value: 'false'
  - id: input_direction
    type: int
    initial_value: '1' 
  - id: ui_enable_speaker
    type: bool
    initial_value: 'true'
  - id: vault_xp
    type: int
    initial_value: '0'
  - id: vault_hp
    type: int
    initial_value: '100'

# =========================================
# SENSORS (Abridged to essentials for compilation)
# =========================================
sensor:
  - platform: template
    name: "Pip-Boy HP"
    id: telemetry_hp
    lambda: 'return id(vault_hp);'
    update_interval: 2s
  - platform: template
    name: "Pip-Boy Radiation Level"
    id: current_rads
    unit_of_measurement: "RAD"

interval:
  - interval: 100ms
    then:
      - lambda: |-
          static std::string line = "";
          while (id(uart_coproc).available()) {
            uint8_t c;
            id(uart_coproc).read_byte(&c);
            if (c == '\n') {
              if (line.rfind("RAD:", 0) == 0) { 
                int rads = atoi(line.substr(4).c_str());
                id(current_rads).publish_state(rads);
              }
              line = "";
            } else {
              line += (char)c;
            }
          }

# =========================================
# DISPLAY & TOUCH CONFIGURATION
# =========================================
touchscreen:
  - platform: gt911
    display: my_display
    interrupt_pin: GPIO18
    reset_pin: GPIO38
    id: my_touch

display:
  - platform: rpi_dpi_rgb
    id: my_display
    dimensions:
      width: 800
      height: 480
    pclk_frequency: 15MHz
    hsync_pulse_width: 1
    hsync_back_porch: 42
    hsync_front_porch: 20
    vsync_pulse_width: 10
    vsync_back_porch: 12
    vsync_front_porch: 4
    pclk_inverted: true
    color_order: rgb
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    data_pins:
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO1]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]
    
    # Critical: No Auto-Clear, Fast Update
    auto_clear_enabled: false
    update_interval: 50ms 
    
    lambda: |-
      // --- THE VIEWPORT WIPE ---
      // We manually clear ONLY the 608x480 usable area on the left.
      // The remaining 192 pixels on the right stay dark.
      it.filled_rectangle(0, 0, 608, 480, Color(0, 0, 0));
      
      // --- BOOT SEQUENCE ---
      if (id(show_boot_screen)) {
          uint32_t elapsed = millis() - id(boot_start_time);
          if (elapsed > 500) {
              it.printf(19, 40, id(pip_sub_font), id(pip_bright), TextAlign::TOP_LEFT, "ROBCO INDUSTRIES UNIFIED OPERATING SYSTEM");
              it.printf(19, 80, id(pip_sub_font), id(pip_bright), TextAlign::TOP_LEFT, "COPYRIGHT 2077 ROBCO(R)");
          }
          if (elapsed > 1500) {
              it.printf(19, 160, id(pip_sub_font), id(pip_bright), TextAlign::TOP_LEFT, "Pip-Boy 3000 Mark IV");
              it.printf(19, 200, id(pip_sub_font), id(pip_bright), TextAlign::TOP_LEFT, "Version %s", "${pip_version}");
          }
          if (elapsed > 3000 && elapsed < 9000) {
              it.printf(19, 300, id(pip_sub_font), id(pip_bright), TextAlign::TOP_LEFT, "Mounting Holotape Drive...");
          }
          if (elapsed > 16000) {
              id(show_boot_screen) = false; 
          }
          return; // Stop drawing UI while booting
      }

      // --- MAIN MENU BAR ---
      int main_y = 50;  // Scaled down
      const char* main_labels[] = {"STAT", "INV", "DATA", "MAP"}; 
      int main_x_pos[] = {76, 190, 418, 532}; // Scaled across 608px
      
      for (int i = 0; i < 4; i++) {
          Color draw_color = (id(active_main_tab) == i) ? id(pip_bright) : id(pip_unselected);
          it.printf(main_x_pos[i], main_y, id(pip_main_font), draw_color, TextAlign::CENTER, main_labels[i]);
      }

      // --- RAD GAUGE (Scaled) ---
      if (id(active_main_tab) == 0 && id(active_sub_tab) == 0) {
          float rads = id(current_rads).state;
          if (std::isnan(rads)) rads = 0.0;
          
          int cx = 604; // Flushed against the far right of the 608px viewport
          int cy = 240; // Center Y
          int radius = 114; 
          
          // Draw Gauge Backing
          for(int r_offset = 0; r_offset < 5; r_offset++) {
              it.circle(cx, cy, radius - r_offset, id(pip_line));
          }
          it.printf(600, 110, id(pip_sub_font), id(pip_bright), TextAlign::TOP_RIGHT, "RADS");
          it.printf(600, 160, id(pip_main_font), id(pip_bright), TextAlign::TOP_RIGHT, "%.1f", rads);
      }

      // --- MEMORY CORE PUZZLE (Scaled) ---
      if (id(active_main_tab) == 2) {
          it.printf(304, 100, id(pip_main_font), id(pip_bright), TextAlign::CENTER, "MEMORY CORE REPAIR");
          int start_x = 114, start_y = 160, cell_w = 95, cell_h = 50; 
          
          for (int r = 0; r < 4; r++) {
              for (int c = 0; c < 4; c++) {
                  int idx = r * 4 + c;
                  int val = id(hex_grid)[idx];
                  it.rectangle(start_x+(c*cell_w), start_y+(r*cell_h), cell_w-4, cell_h-4, id(pip_line));
                  Color txt_col = id(locked_cells)[idx] ? id(pip_unselected) : id(pip_bright);
                  it.printf(start_x+(c*cell_w)+47, start_y+(r*cell_h), id(pip_sub_font), txt_col, TextAlign::TOP_CENTER, "%02X", val);
              }
          }
      }
