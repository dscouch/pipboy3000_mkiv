                      x: 460
                      y: 220
                      width: 100
                      height: 50
                      bg_color: 0x000000
                      border_width: 2
                      border_color: pip_line
                      widgets:
                        - label:
                            text: "00"
                            align: CENTER
                            text_color: pip_bright
                            text_font: pip_sub_font
                      on_click:
                        - lambda: |-
                            ESP_LOGI("ROBCO", "Transmitting override code to Dweller 612...");
                            // We will hook your BLE/WiFi transmission code here later!

              # --- TAB 4: MAP ---
              - name: "MAP"
                scrollable: false
                widgets:
                  # --- THE MAP SIDE NAVIGATION MENU ---
                  - buttonmatrix: 
                      id: map_side_menu
                      x: 10
                      y: 20
                      width: 140
                      height: 250
                      one_checked: true
                      items:
                        text_font: pip_sub_font
                      # Temporary labels. The boot sequence C++ will override DOC A & B
                      rows:
                        - buttons:
                          - text: "MAP 1"
                            control: { checkable: true, checked: true }
                        - buttons:
                          - text: "MAP 2"
                            control: { checkable: true, checked: false }
                        - buttons:
                          - text: "MAP 3"
                            control: { checkable: true, checked: false }
                        - buttons:
                          - text: "DOC A"
                            control: { checkable: true, checked: false }
                        - buttons:
                          - text: "DOC B"
                            control: { checkable: true, checked: false }
                      on_click:
                        - lambda: |-
                            uint16_t btn_id = lv_btnmatrix_get_selected_btn(id(map_side_menu).obj);
                            if (btn_id == LV_BTNMATRIX_BTN_NONE) return;
                            
                            // 1. Hide ALL sub-pages
                            lv_obj_add_flag(id(map1_page), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_add_flag(id(map2_page), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_add_flag(id(map3_page), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_add_flag(id(doc_a_page), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_add_flag(id(doc_b_page), LV_OBJ_FLAG_HIDDEN);
                            
                            // 2. Reveal the chosen page
                            if (btn_id == 0) lv_obj_clear_flag(id(map1_page), LV_OBJ_FLAG_HIDDEN);
                            else if (btn_id == 1) lv_obj_clear_flag(id(map2_page), LV_OBJ_FLAG_HIDDEN);
                            else if (btn_id == 2) lv_obj_clear_flag(id(map3_page), LV_OBJ_FLAG_HIDDEN);
                            else if (btn_id == 3) lv_obj_clear_flag(id(doc_a_page), LV_OBJ_FLAG_HIDDEN);
                            else if (btn_id == 4) lv_obj_clear_flag(id(doc_b_page), LV_OBJ_FLAG_HIDDEN);

# --- MAP 1 PAGE (Visible by default) ---
                  - obj:
                      id: map1_page
                      x: 160
                      y: 10
                      width: 420
                      height: 420
                      bg_color: 0x000000
                      border_width: 0
                      scrollable: false
                      widgets:
                        - label:
                            text: "FLOOR PLAN 1"
                            x: 120
                            y: 10
                        
                        # 1. THE MAP BACKGROUND
                        - image:
                            src: map_img_1
                            x: 10
                            y: 50  # Shifted down to clear the title text
                            
                        # 2. THE RED RADIATION INDICATOR (Drawn on top!)
                        - obj:
                            id: map1_rad_led
                            x: 30  # Adjust X/Y to position the dot over the right room
                            y: 210
                            width: 20
                            height: 20
                            bg_color: pip_alert
                            border_width: 0
                            radius: 10

                  # --- MAP 2 PAGE (Hidden) ---
                  - obj:
