                      y: 10

                  - label:
                      text: "TARGET PARITY: 0x1E"
                      x: 180
                      y: 300
                      text_color: pip_unselected
                      text_font: pip_sub_font
                      
                  # 1. THE MAIN PUZZLE GRID
                  - buttonmatrix:
                      id: memory_core_grid
                      x: 20 
                      y: 60
                      width: 420
                      height: 220
                      items:
                        text_color: pip_bright

                      rows:
                        - buttons:
                          - text: "00"
                          - text: "0D"
                          - text: "02"
                          - text: "01"
                        - buttons:
                          - text: "0C"
                          - text: "09"
                          - text: "04"
                          - text: "0A"
                        - buttons:
                          - text: "07"
                          - text: "08"
                          - text: "06"
                          - text: "05"
                        - buttons:
                          - text: "0B"
                          - text: "03"
                          - text: "0E"
                          - text: "00"
                      on_click:
                        - lambda: |-
                            uint16_t btn_id = lv_btnmatrix_get_selected_btn(id(memory_core_grid).obj);
                            if (btn_id == LV_BTNMATRIX_BTN_NONE) return;
                            
                            if (id(locked_cells)[btn_id]) {
                              ESP_LOGW("ROBCO", "ACCESS DENIED: Cell %d is locked.", btn_id);
                              return; 
                            }

                            int val = id(hex_grid)[btn_id];
                            val += id(input_direction); 
                            
                            if (val > 15) val = 0;
                            if (val < 0) val = 15;
                            id(hex_grid)[btn_id] = val;
                            
                            // Rebuild the LVGL Button Map with Brackets for locked cells!
                            static char btn_labels[16][8]; // Increased buffer for brackets
                            static const char *new_map[21]; 
                            
                            int map_pos = 0;
                            for (int i = 0; i < 16; i++) {
                              if (id(locked_cells)[i]) {
                                sprintf(btn_labels[i], "[%02X]", id(hex_grid)[i]);
                              } else if (i == 0) { // Cell 00 is linked to the other Pip-Boy
                                sprintf(btn_labels[i], "*%02X*", id(hex_grid)[i]);
                              } else {
                                sprintf(btn_labels[i], " %02X ", id(hex_grid)[i]);
                              }
                              
                              new_map[map_pos++] = btn_labels[i];
                              if ((i + 1) % 4 == 0 && i != 15) {
                                new_map[map_pos++] = "\n";
                              }
                            }
                            new_map[map_pos] = ""; 
                            lv_btnmatrix_set_map(id(memory_core_grid).obj, new_map);

                            int current_sum = 0;
                            for (int i = 0; i < 16; i++) {
                              current_sum += id(hex_grid)[i];
                            }
                            
                            if (current_sum == id(target_sum) && !id(data_solved)) {
                              id(data_solved) = true;
                              ESP_LOGI("ROBCO", "PARITY REACHED (0x1E)!");
                            }
                            
                  # 2. THE MODIFIER GRID (+ / -)
                  - buttonmatrix:
                      id: modifier_grid
                      x: 460
                      y: 60
                      width: 100
                      height: 140
                      one_checked: true 
                      bg_color: 0x000000
                      border_width: 0
                      rows:
                        - buttons:
                          - text: "+"
                        - buttons:
                          - text: "-"
                      on_click:
                        - lambda: |-
                            uint16_t btn_id = lv_btnmatrix_get_selected_btn(id(modifier_grid).obj);
                            if (btn_id == LV_BTNMATRIX_BTN_NONE) return;
                            id(input_direction) = (btn_id == 0) ? 1 : -1;

                  # 3. THE REMOTE UPLINK BUTTON
                  - button:
                      id: btn_remote_uplink
                      x: 460
                      y: 220
                      width: 100
                      height: 50
                      bg_color: 0x000000
                      border_width: 2
                      border_color: pip_line
                      widgets:
                        - label:
                            text: "00"
                            align: CENTER
                            text_color: pip_bright
                            text_font: pip_sub_font
                      on_click:
                        - lambda: |-
                            ESP_LOGI("ROBCO", "Transmitting override code to Dweller 612...");
                            // We will hook your BLE/WiFi transmission code here later!

              # --- TAB 4: MAP ---
              - name: "MAP"
                scrollable: false
                widgets:
                  # --- THE MAP SIDE NAVIGATION MENU ---
                  - buttonmatrix: 
                      id: map_side_menu
                      x: 10
                      y: 20
                      width: 140
                      height: 250
                      one_checked: true
                      items:
                        text_font: pip_sub_font
                      # Temporary labels. The boot sequence C++ will override DOC A & B
                      rows:
                        - buttons:
                          - text: "MAP 1"
                            control: { checkable: true, checked: true }
                        - buttons:
                          - text: "MAP 2"
                            control: { checkable: true, checked: false }
                        - buttons:
                          - text: "MAP 3"
                            control: { checkable: true, checked: false }
                        - buttons:
                          - text: "DOC A"
                            control: { checkable: true, checked: false }
                        - buttons:
                          - text: "DOC B"
                            control: { checkable: true, checked: false }
                      on_click:
                        - lambda: |-
                            uint16_t btn_id = lv_btnmatrix_get_selected_btn(id(map_side_menu).obj);
                            if (btn_id == LV_BTNMATRIX_BTN_NONE) return;
                            
                            // 1. Hide ALL sub-pages
                            lv_obj_add_flag(id(map1_page), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_add_flag(id(map2_page), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_add_flag(id(map3_page), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_add_flag(id(doc_a_page), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_add_flag(id(doc_b_page), LV_OBJ_FLAG_HIDDEN);
                            
                            // 2. Reveal the chosen page
                            if (btn_id == 0) lv_obj_clear_flag(id(map1_page), LV_OBJ_FLAG_HIDDEN);
                            else if (btn_id == 1) lv_obj_clear_flag(id(map2_page), LV_OBJ_FLAG_HIDDEN);
                            else if (btn_id == 2) lv_obj_clear_flag(id(map3_page), LV_OBJ_FLAG_HIDDEN);
                            else if (btn_id == 3) lv_obj_clear_flag(id(doc_a_page), LV_OBJ_FLAG_HIDDEN);
                            else if (btn_id == 4) lv_obj_clear_flag(id(doc_b_page), LV_OBJ_FLAG_HIDDEN);

# --- MAP 1 PAGE (Visible by default) ---
                  - obj:
                      id: map1_page
                      x: 160
                      y: 10
                      width: 420
                      height: 420
                      bg_color: 0x000000
                      border_width: 0
                      scrollable: false
                      widgets:
