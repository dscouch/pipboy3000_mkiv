# =========================================
# DWELLER IDENTITY & SECRETS
# =========================================
substitutions:
  pip_version: "v2.1.2-LVGL"
  dweller_id: "793"    # 793 or 612
  other_id: "612"
  device_name: "pipboy-${dweller_id}"
  friendly_name: "Vault Dweller ${dweller_id}"
  
  # Hex Puzzle Arrays
  data_793_grid: &grid793 '{0x0, 0xD, 0x2, 0x1, 0xC, 0x9, 0x4, 0xA, 0x7, 0x8, 0x6, 0x5, 0xB, 0x3, 0xE, 0x0}'
  data_612_grid: &grid612 '{0x0, 0x4, 0xF, 0xE, 0x5, 0x9, 0xD, 0x2, 0xA, 0x6, 0x1, 0x0, 0xB, 0xC, 0x7, 0x8}'
  cell_793_lock: &lock793 '{true, false, false, false, false, true, false, false, false, false, true, false, false, false, false, true}'
  cell_612_lock: &lock612 '{true, false, false, false, false, false, false, true, false, true, false, false, false, false, true, false}'
  
  # ACTIVE DWELLER SELECTOR
  active_grid: *grid793 
  active_lock: *lock793

# =========================================
# ESPHOME 
# =========================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.2.4
  name_add_mac_suffix: false
  on_boot:
    priority: 800
    then:
      - output.turn_on: backlight_pin
      - script.execute: robco_boot_sequence
      - lambda: |-
          id(boot_start_time) = millis(); 
          ESP_LOGI("ROBCO", "=============================================");
          ESP_LOGI("ROBCO", " PIP-OS(R) V7.1.0.8 - COPYRIGHT ROBCO IND.");
          ESP_LOGI("ROBCO", " COMPILED FIRMWARE VERSION: %s", "${pip_version}");
          ESP_LOGI("ROBCO", "=============================================");

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  # This is the ONE and ONLY place this command is allowed to exist
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
     
psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
# =========================================
# HOME ASSISTANT CONNECTION
# =========================================
# (Ensure your secrets.yaml has these defined!)
api:
  encryption:
    key: !secret pipboy_api_key 

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .home 

ota:
  - platform: esphome

debug: 
  update_interval: 5s
# =========================================
# RPG & PUZZLE STATE (GLOBALS)
# =========================================
globals:
  # Memory Core Puzzle
  - id: hex_grid
    type: int[16]
    initial_value: ${active_grid}
  - id: locked_cells
    type: bool[16] 
    initial_value: ${active_lock}
  - id: target_sum
    type: int
    initial_value: '30' 
  - id: data_solved
    type: bool
    initial_value: 'false'
    restore_value: no
  - id: input_direction
    type: int
    restore_value: no
    initial_value: '1' # 1 for forward (+), -1 for backward (-)
    
  # RPG Stats
  - id: vault_xp
    type: int
    initial_value: '0'
    restore_value: yes 
  - id: vault_hp
    type: int
    initial_value: '100'
    restore_value: yes 
    
  # Reactor Meltdown Status
  - id: meltdown_hold_time
    type: int
    initial_value: '0'
    restore_value: no

#   - id: show_boot_screen
#     type: bool
#     initial_value: 'true'
  - id: boot_start_time
    type: uint32_t
    initial_value: '0'
  - id: boot_step
    type: int
    initial_value: '0'
  - id: boot_buffer
    type: std::string
    initial_value: '""'
#   - id: ui_enable_speaker
#     type: bool
#     initial_value: 'true'

# =========================================
# HARDWARE & BUSES
# =========================================
output:
  - platform: gpio
    pin: GPIO2
    id: backlight_pin
    inverted: true

i2c:
  - sda: GPIO19
    scl: GPIO20
    scan: true
    id: bus_a

# The Coprocessor UART Bus ====================================================
# (Pins mapped to available headers since the S3 Edge pins changed)
uart:
  id: uart_coproc
  tx_pin: GPIO10  # Recommend using SD-Card or unused pins
  rx_pin: GPIO11  
  baud_rate: 9600

# --- THE DISPLAY HARDWARE ---
# Notice there is no lambda here anymore! LVGL takes control.
# Size of visible display is 600x480 starting at x=200
display:
  - platform: rpi_dpi_rgb
    id: my_display
    dimensions:
      width: 800
      height: 480
    pclk_frequency: 15MHz
    hsync_pulse_width: 1
    hsync_back_porch: 42
    hsync_front_porch: 20
    vsync_pulse_width: 10
    vsync_back_porch: 12
    vsync_front_porch: 4
    pclk_inverted: true
    color_order: rgb
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    data_pins:
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO1]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]

touchscreen:
  - platform: gt911
    display: my_display
    id: my_touch
    # Explicitly lock in the address we found in your log
    address: 0x5D 
    # Keep the reset pin so it boots cleanly
    reset_pin: GPIO38 
    
    # Notice: interrupt_pin is COMPLETELY GONE. 
    # This forces Polling Mode!
    
    on_touch:
      - lambda: |-
          ESP_LOGI("TOUCH_DEBUG", "RAW TAP: X: %d | Y: %d", touch.x, touch.y);



# =========================================
# GLOBAL COLORS
# =========================================
color:
  - id: pip_bright
    red: 0%
    green: 100%
    blue: 0%
  - id: pip_unselected
    red: 0%
    green: 60%
    blue: 0%
  - id: pip_line 
    red: 0%
    green: 20%
    blue: 0%
  - id: pip_alert
    red: 100%
    green: 0%
    blue: 0%

# =========================================
# GLOBAL FONTS
# =========================================
font:
  - file: "monofonto.otf"
    id: pip_main_font
    size: 36
    glyphs: 
      - ' !"%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
  - file: "monofonto.otf"
    id: pip_sub_font
    size: 27
    glyphs:
      - ' !"%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
      - 'Σ'

animation:
  - file: "vaultboy_walking.gif"
    id: anim_vault_boy
    type: RGB565

# =========================================
# SYSTEM SCRIPTS
# =========================================

#"Checking geiger counter calibration...");
# "Verifying S.P.E.C.I.A.L. parameters...");
#"Initializing Biometrics...");
#"Subject: Dweller %s", "${dweller_id}");
#"Biometrics Initialized.");

script:
  - id: robco_boot_sequence
    then:
      # 1. Show the blank boot screen
      - lvgl.page.show: boot_screen
      - delay: 500ms
      
      # 2. Loop through the array of text
      - while:
          condition:
            lambda: |-
              // UPDATE THIS NUMBER if you add more lines to the array below!
              return id(boot_step) < 12; 
          then:
            # Grab the next line and add it to our text buffer
            - lambda: |-
                std::vector<std::string> lines = {
                  "ROBCO INDUSTRIES UNIFIED OPERATING SYSTEM\n",
                  "COPYRIGHT 2075-2077 ROBCO INDUSTRIES\n",
                  "Pip-Boy 3000 Mark IV\n",
                  "\n",
                  "Testing RAM... 640K OK\n",
                  "Loading holotape drivers... OK\n",
                  "Booting Pip-OS(R) ${pip_version}\n"
                  "\n"
                  "Initializing Biometrics...\n"
                  " ...  Please stop struggling ...\n"
                  "Subject: Dweller: ${dweller_id}\n"
                  "Biometrics Initialized.\n"
                };
                id(boot_buffer) += lines[id(boot_step)];
                id(boot_step)++; // Move to the next line for the next loop
                
            # Push the updated buffer to the LVGL label
            - lvgl.label.update:
                id: ui_boot_text
                text: !lambda "return id(boot_buffer).c_str();"
                
            # The speed at which new lines appear
            - delay: 2s 
            
      # 3. Hold for dramatic effect when finished, then launch the UI!
      - delay: 5s
      - lvgl.page.show: main_interface

# =========================================
# SENSORS (Abridged to essentials for compilation)
# =========================================
sensor:
  - platform: template
    name: "Pip-Boy HP"
    id: telemetry_hp
    lambda: 'return id(vault_hp);'
    update_interval: 2s
  - platform: template
    name: "Pip-Boy Radiation Level"
    id: current_rads
    unit_of_measurement: "RAD"

interval:
  - interval: 100ms
    then:
      - lambda: |-
          static std::string line = "";
          while (id(uart_coproc).available()) {
            uint8_t c;
            id(uart_coproc).read_byte(&c);
            if (c == '\n') {
              if (line.rfind("RAD:", 0) == 0) { 
                int rads = atoi(line.substr(4).c_str());
                id(current_rads).publish_state(rads);
              }
              line = "";
            } else {
              line += (char)c;
            }
          }
  # The Animation Clock
  - interval: 100ms # Decrease to 50ms to make him walk faster!
    then:
      - animation.next_frame: anim_vault_boy
# =========================================
# DISPLAY CONFIGURATION
# =========================================

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  bg_color: 0x000000

  pages:
    # ==========================================
    # PAGE 0: THE ROBCO BOOT SEQUENCE
    # ==========================================
    - id: boot_screen
      bg_color: 0x000000
      widgets:
        - label:
            id: ui_boot_text
            text: ""   # Starts completely blank
            x: 220      # Gives it a nice command-line margin
            y: 20
            width: 560 # Keeps it from wrapping off-screen
            text_color: pip_bright
            text_font: pip_sub_font

    # ==========================================
    # PAGE 1: THE MAIN PIP-BOY INTERFACE
    # ==========================================
    - id: main_interface
      bg_color: 0x000000
      widgets:
        
        # --- THE PERSISTENT FOOTER (Shifted +192px to the right) ---
        - label:
            text: "HP:"
            x: 240
            y: 445
            text_color: pip_bright
            text_font: pip_main_font
        - label:
            text: "100"
            x: 290
            y: 445
            text_color: pip_bright
            text_font: pip_main_font
            
        - label:
            text: ${pip_version}
            # Replaced BOTTOM_MID alignment with an absolute X coordinate 
            # to center it perfectly within the new 608px window
            x: 425 
            y: 450
            text_color: pip_unselected
            text_font: pip_sub_font
            
        - label:
            text: "XP:"
            x: 672
            y: 445
            text_color: pip_bright
            text_font: pip_main_font
        - label:
            text: "0"
            x: 722
            y: 445
            text_color: pip_bright
            text_font: pip_main_font

        # --- THE MAIN TABVIEW (Shifted +192px to the right) ---
        - tabview:
            id: main_tabs
            x: 220
            y: 0
            width: 580
            height: 440 
            bg_color: 0x000000
            tab_style:
              bg_color: 0x000000
              text_color: pip_unselected
              text_font: pip_main_font
              items:
                checked:
                  bg_color: pip_line 
                  text_color: pip_bright
            tabs:
              # --- TAB 1: STAT ---
              - name: "STAT"
                widgets:
                  - roller:
                      x: 10
                      y: 50
                      width: 150
                      options:
                        - STATUS
                        - S.P.E.C.I.A.L.
                        - PERKS
                      visible_row_count: 3
                      text_color: pip_unselected
                      bg_color: 0x000000
                      selected:
                        bg_color: pip_line
                        text_color: pip_bright
                  # ==========================================
                  # ANIMATED VAULT BOY
                  # ==========================================
                  - image:
                      src: anim_vault_boy
                      x: 220
                      y: 80
                  # ==========================================
                  # RAD GAUGE (Stacked Method)
                  # ==========================================
                  - arc:
                      id: lv_arc_6
                      x: 400  #was 450
                      y: 40
                      width: 250
                      height: 250
                      value: 25
                      min_value: 0
                      max_value: 50
                      adjustable: false
                      start_angle: 0
                      end_angle: 180
                      rotation: 90
                      arc_color: pip_line
                      arc_width: 25
                      arc_opa: 100%
                      arc_rounded: false
                      indicator:
                        arc_color: pip_bright
                        arc_width: 25
                      widgets:
                        - label:
                            x: 70
                            y: 100
                            text: "RADS"
                            text_color: pip_bright
                            text_font: pip_sub_font
                        - label:
                            id: lbl_rads
                            x: 80
                            y: 125
                            text: "25"
                            text_color: pip_bright
                            text_font: pip_main_font
              # --- TAB 2: INV ---
              - name: "INV"
                widgets:
                  - bar:
                      x: 550
                      y: 20
                      width: 20
                      height: 200
                      value: 50
                      bg_color: pip_line
                      indicator:
                        bg_color: pip_bright

              # --- TAB 3: DATA (Memory Core) ---
              - name: "DATA"
                widgets:
                  - label:
                      text: "MEMORY CORE REPAIR"
                      x: 150
                      y: 10
                      text_color: pip_bright
                      text_font: pip_main_font
                  - label:
                      text: "TARGET PARITY: 0x1E"
                      x: 180
                      y: 300
                      text_color: pip_unselected
                      text_font: pip_sub_font
                      
                  # 1. THE MAIN PUZZLE GRID
                  - buttonmatrix:
                      id: memory_core_grid
                      x: 40 
                      y: 60
                      width: 380
                      height: 220
                      # --- FLATTENED CASCADING STYLES ---
                      bg_color: 0x000000
                      text_color: pip_bright
                      text_font: pip_main_font
                      border_width: 0
                      rows:
                        - buttons:
                          - text: "00"
                          - text: "0D"
                          - text: "02"
                          - text: "01"
                        - buttons:
                          - text: "0C"
                          - text: "09"
                          - text: "04"
                          - text: "0A"
                        - buttons:
                          - text: "07"
                          - text: "08"
                          - text: "06"
                          - text: "05"
                        - buttons:
                          - text: "0B"
                          - text: "03"
                          - text: "0E"
                          - text: "00"
                      # --- THE INTERACTIVE C++ PUZZLE ENGINE ---
                      on_click:
                        - lambda: |-
                            // Ask LVGL which button in this matrix has the current focus
                            uint16_t btn_id = lv_btnmatrix_get_selected_btn(id(memory_core_grid).obj);
                            if (btn_id == LV_BTNMATRIX_BTN_NONE) return; // Safety check
                            
                            // 1. Check if the cell is hardware-locked
                            if (id(locked_cells)[btn_id]) {
                              ESP_LOGW("ROBCO", "ACCESS DENIED: Cell %d is locked by the Memory Core.", btn_id);
                              return; // Stop the script right here
                            }

                            // 2. Modify the Hex Value
                            int val = id(hex_grid)[btn_id];
                            val += id(input_direction); // Adds 1 or -1
                            
                            // Wrap around standard hex values (0x0 to 0xF)
                            if (val > 15) val = 0;
                            if (val < 0) val = 15;
                            
                            // Save the new value back to the global array
                            id(hex_grid)[btn_id] = val;
                            
                            // 3. Rebuild the LVGL Button Map
                            static char btn_labels[16][4];
                            static const char *new_map[21]; 
                            
                            int map_pos = 0;
                            for (int i = 0; i < 16; i++) {
                              sprintf(btn_labels[i], "%02X", id(hex_grid)[i]);
                              new_map[map_pos++] = btn_labels[i];
                              
                              if ((i + 1) % 4 == 0 && i != 15) {
                                new_map[map_pos++] = "\n";
                              }
                            }
                            new_map[map_pos] = ""; 
                            
                            // Push the newly generated map directly into the LVGL graphics object
                            lv_btnmatrix_set_map(id(memory_core_grid).obj, new_map);

                            // 4. Check if the parity puzzle is solved!
                            int current_sum = 0;
                            for (int i = 0; i < 16; i++) {
                              current_sum += id(hex_grid)[i];
                            }
                            
                            if (current_sum == id(target_sum) && !id(data_solved)) {
                              id(data_solved) = true;
                              ESP_LOGI("ROBCO", "PARITY REACHED (0x1E)! MEMORY CORE REPAIRED!");
                            } else {
                              ESP_LOGD("ROBCO", "Current Core Parity: %d", current_sum);
                            }
                            
                  # 2. THE MODIFIER GRID (+ / -)
                  - buttonmatrix:
                      id: modifier_grid
                      x: 440
                      y: 60
                      width: 80
                      height: 220
                      one_checked: true 
                      # --- FLATTENED CASCADING STYLES ---
                      bg_color: 0x000000
                      text_color: pip_bright
                      text_font: pip_main_font
                      border_width: 0
                      rows:
                        - buttons:
                          - text: "+"
                        - buttons:
                          - text: "-"
                      # --- THE MODIFIER TRIGGER ---
                      on_click:
                        - lambda: |-
                            // Ask LVGL which modifier button was pressed
                            uint16_t btn_id = lv_btnmatrix_get_selected_btn(id(modifier_grid).obj);
                            if (btn_id == LV_BTNMATRIX_BTN_NONE) return;
                            
                            if (btn_id == 0) {
                              id(input_direction) = 1;  
                              ESP_LOGI("ROBCO", "Modifier set to ADD");
                            } else {
                              id(input_direction) = -1; 
                              ESP_LOGI("ROBCO", "Modifier set to SUBTRACT");
                            }

              # --- TAB 4: MAP ---
              - name: "MAP"
                widgets:
                  - switch:
                      x: 50
                      y: 50
                      width: 60
                      height: 30
                      bg_color: pip_line
                      indicator:
                        bg_color: pip_bright
                      knob:
                        bg_color: pip_bright

    # ==========================================
    # PAGE 2: THE MELTDOWN SEQUENCE (Hidden)
    # ==========================================
    - id: meltdown_screen
      bg_color: 0x330000 # Dark Red Background
      widgets:
        - label:
            text: "CRITICAL ALERT"
            align: CENTER
            x: 510
            y: -40
            text_color: 0xFF0000 # Bright Red
            text_font: pip_main_font
        - label:
            text: "REACTOR MELTDOWN IMMINENT"
            align: CENTER
            x: 510
            y: 20
            text_color: 0xFF0000
            text_font: pip_sub_font
