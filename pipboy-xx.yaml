                                        lv_obj_add_flag(id(puzzle_alpha_container), LV_OBJ_FLAG_HIDDEN);
                                        lv_obj_add_flag(id(inv_puzzle_overlay), LV_OBJ_FLAG_HIDDEN);
                                        
                                        // Award XP
                                        id(add_xp).execute(50);

                                      } else {
                                        // THEY GUESSED WRONG! Trigger the penalty.
                                        id(puzzle_failed_penalty).execute();
                                      }

