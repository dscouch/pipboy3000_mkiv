                        - obj: { id: map3_rad2_led, x: 85, y: 105, width: 20, height: 20, bg_color: pip_alert, border_width: 0, radius: 10 }

                  # --- DOC A PAGE (Hidden) ---
                  - obj:
                      id: doc_a_page
