    update_interval: 2s
  - platform: template
    name: "Pip-Boy Radiation Level"
    id: current_rads
    unit_of_measurement: "RAD"

  # =========================================
  # SYSTEM DIAGNOSTICS
  # =========================================
  - platform: uptime
    id: pipboy_uptime
    name: "Pip-Boy Uptime"
    update_interval: 60s

  - platform: template
    name: "Pip-Boy Free Internal Heap"
    id: diag_free_heap
    unit_of_measurement: "B"
    icon: "mdi:memory"
    update_interval: 10s
    accuracy_decimals: 0
    lambda: |-
      return heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);

  - platform: template
    name: "Pip-Boy Largest Free Block"
    id: diag_largest_block
    unit_of_measurement: "B"
    icon: "mdi:memory"
    update_interval: 10s
    accuracy_decimals: 0
    lambda: |-
      return heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);

  - platform: template
    name: "Pip-Boy Heap Fragmentation"
    id: diag_heap_frag
    unit_of_measurement: "%"
    icon: "mdi:puzzle-outline"
    update_interval: 10s
    accuracy_decimals: 1
    lambda: |-
      float free_heap = heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);
      float largest_block = heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);
      
      if (free_heap > 0) {
        return 100.0 - ((largest_block / free_heap) * 100.0);
      }
      return 0.0;

  # >>> [SYS-GAME-PUZ] Shared puzzle memory (Home Assistant) - Magic square
  # >>> [SYS-HA-CONN] Remote cell receiver and HP sync <<<
  - platform: homeassistant
    id: ha_remote_cell_zero
    entity_id: input_number.dweller_${dweller_id}_cell_zero
    on_value:
      - lambda: |-
          id(hex_grid)[0] = (int)x;
          
          char buf[8];
