# =========================================
# SYSTEM SCRIPTS
# =========================================
script:
  - id: robco_boot_sequence
    then:
      # 1. Show the blank boot screen
      - lvgl.page.show: boot_screen
      - delay: 500ms
      
      # 2. Loop through the array of text
      - while:
          condition:
            lambda: |-
              return id(boot_step) < 13; 
          then:
            # Grab the next line and add it to our text buffer
            - lambda: |-
                std::vector<std::string> lines = {
                  "****** PIP-OS(R) ${pip_version} *******\n",
                  "COPYRIGHT 2075 ROBCO(R)\n",
                  "LOADER V1.1\n",
                  "EXEC VERSION 41.10\n",
                  "64K RAM SYSTEM\n",
                  "38911 BYTES FREE\n",
                  "NO HOLOTAPE FOUND\n",
                  "Pip-Boy 3000 Mark IV\n",
                  "\n",
                  "Initializing Biometrics...\n",
                  " --- Please stop struggling ---\n",
                  "Subject: Dweller: ${dweller_id}\n",
                  "Biometrics Initialized.",
                  "Calibrating geiger counter... OK\n"
                };
                id(boot_buffer) += lines[id(boot_step)];
                id(boot_step)++; 
                
            # Push the updated buffer to the LVGL label
            - lvgl.label.update:
                id: ui_boot_text
                text: !lambda "return id(boot_buffer).c_str();"
                
            # The speed at which new lines appear
            - delay: 20ms #2s to be annoying
            
      # 3. Hold for dramatic effect when finished
      - delay: 2s  #5s to be annoying
      
      # --- NEW: SWAP TO THE THUMBS UP IMAGE ---
      - lambda: |-
          // Hide the text block
          lv_obj_add_flag(id(ui_boot_text), LV_OBJ_FLAG_HIDDEN);
          
          // Unhide the thumbs up image
          lv_obj_clear_flag(id(ui_boot_image), LV_OBJ_FLAG_HIDDEN);
          
      # Hold the image on screen for a few seconds before loading the UI
      - delay: 5s

      # 4. INITIALIZE GRIDS & LOGIC BEFORE SHOWING THE UI!
      - lambda: |-
          // ---> ANNIHILATE THE BLUE INDICATOR LINE & FOCUS RINGS <---
          lv_obj_t * tab_btns = lv_tabview_get_tab_btns(id(main_tabs));
          
          // Set the indicator height to 0 across ALL states
          lv_obj_set_style_height(tab_btns, 0, (uint32_t)LV_PART_INDICATOR | (uint32_t)LV_STATE_ANY);
          
          // Ensure the outline (focus ring) is dead across ALL states
          lv_obj_set_style_outline_width(tab_btns, 0, (uint32_t)LV_PART_ITEMS | (uint32_t)LV_STATE_ANY);

          // Generate the initial text map with the brackets
          static char init_labels[16][8];
          static const char *init_map[21]; 
          int p = 0;
          for (int i = 0; i < 16; i++) {
            if (id(locked_cells)[i]) {
              sprintf(init_labels[i], "[%02X]", id(hex_grid)[i]);
            } else if (i == 0) {
              sprintf(init_labels[i], "*%02X*", id(hex_grid)[i]);
            } else {
              sprintf(init_labels[i], " %02X ", id(hex_grid)[i]);
            }
            init_map[p++] = init_labels[i];
            if ((i + 1) % 4 == 0 && i != 15) init_map[p++] = "\n";
          }
          init_map[p] = ""; 
          lv_btnmatrix_set_map(id(memory_core_grid).obj, init_map);

          // Inject Dynamic Doc Labels into Map Menu
          static const char * doc_1_str = (std::string("${dweller_id}") == "793") ? "DOC 1" : "DOC 3";
          static const char * doc_2_str = (std::string("${dweller_id}") == "793") ? "DOC 2" : "DOC 4";
          static const char * map_labels[] = {"MAP 1", "\n", "MAP 2", "\n", "MAP 3", "\n", doc_1_str, "\n", doc_2_str, ""};
          lv_btnmatrix_set_map(id(map_side_menu).obj, map_labels);

          // Enable the Geiger Counter settings & flip the UI switches!
          id(rad_sound_enabled) = true;
          id(rad_haptic_enabled) = true;
          lv_obj_add_state(id(switch_rad_sound), LV_STATE_CHECKED);
          lv_obj_add_state(id(switch_rad_haptic), LV_STATE_CHECKED);

      # 4. INITIALIZE GRIDS & LOGIC BEFORE SHOWING THE UI!
      - lambda: |-
          // ---> FORCE THE TAB UNDERLINE COLOR <---
          // (YAML doesn't support LV_PART_INDICATOR on tabviews yet)
          lv_obj_t * tab_btns = lv_tabview_get_tab_btns(id(main_tabs));
          lv_obj_set_style_bg_color(tab_btns, lv_color_hex(0x00FF00), (uint32_t)LV_PART_INDICATOR | (uint32_t)LV_STATE_CHECKED);
          lv_obj_set_style_height(tab_btns, 2, (uint32_t)LV_PART_INDICATOR | (uint32_t)LV_STATE_CHECKED);

          // Generate the initial text map with the brackets
          static char init_labels[16][8];

      # ---> START THE VAULT BOY ANIMATION! <---
      - lvgl.animimg.start: vault_boy_anim

      # 5. Launch the UI!
      - lvgl.page.show: main_interface

      # 6. Animate the Rad Meter Needle (Calibration Test)
      - lambda: |-
          lv_anim_t a;
          lv_anim_init(&a);
          
          // Target the red needle
          lv_anim_set_var(&a, id(rad_needle));
          
          // Move from 0 to the maximum value of 50
          lv_anim_set_values(&a, 0, 50);
          
          // Set the time for the upward movement (800 milliseconds)
          lv_anim_set_time(&a, 800); 
          
          // Set the time for the downward movement (800 milliseconds)
          lv_anim_set_playback_time(&a, 800); 
          
          // Add a brief pause at the top before it falls back down
          lv_anim_set_playback_delay(&a, 200); 
          
          // Use a smooth movement curve
          lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out); 
          
          // Tell the animation how to update the needle position
          lv_anim_set_exec_cb(&a, [](void * var, int32_t v) {
              lv_meter_set_indicator_value(id(rad_meter), (lv_meter_indicator_t *)var, v);
          });
          
          // Start the animation
          lv_anim_start(&a);

  # =========================================
  # REWARDS AND GAMEPLAY SCRIPTS
  # =========================================
  - id: add_xp
    parameters:
      amount: int
    then:
      - lambda: |-
          id(vault_xp) += amount;
          lv_label_set_text_fmt(id(ui_xp_label), "%d", id(vault_xp));
          
          // Notify Home Assistant about the new total
          id(ha_xp_control).publish_state(id(vault_xp));
          
          ESP_LOGI("ROBCO", "XP Added: %d. Total XP: %d", amount, id(vault_xp));

  - id: puzzle_failed_penalty
    then:
      - lambda: |-
          // Deduct 25 HP, but do not drop below 0
          id(vault_hp) -= 25;
          if (id(vault_hp) < 0) id(vault_hp) = 0; 
          
          // Update the screen and Home Assistant
          lv_label_set_text_fmt(id(ui_hp_label), "%d", id(vault_hp));
          id(telemetry_hp).publish_state(id(vault_hp));
          
          // Close the puzzle
          id(puzzle_is_open) = false;
          lv_obj_add_flag(id(inv_puzzle_overlay), LV_OBJ_FLAG_HIDDEN);
          
          ESP_LOGW("ROBCO", "Puzzle failed. 25 HP deducted.");

# =========================================
# SENSORS (Abridged to essentials for compilation)
# =========================================
sensor:
  - platform: template
    name: "Pip-Boy HP"
    id: telemetry_hp
    lambda: 'return id(vault_hp);'
    update_interval: 2s
  - platform: template
    name: "Pip-Boy Radiation Level"
    id: current_rads
    unit_of_measurement: "RAD"

  # =========================================
  # SYSTEM DIAGNOSTICS
  # =========================================
  - platform: template
    name: "Pip-Boy Free Internal Heap"
    id: diag_free_heap
    unit_of_measurement: "B"
    icon: "mdi:memory"
    update_interval: 10s
    accuracy_decimals: 0
    lambda: |-
      return heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);

  - platform: template
    name: "Pip-Boy Largest Free Block"
    id: diag_largest_block
    unit_of_measurement: "B"
    icon: "mdi:memory"
    update_interval: 10s
    accuracy_decimals: 0
    lambda: |-
      return heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);

  - platform: template
    name: "Pip-Boy Heap Fragmentation"
    id: diag_heap_frag
    unit_of_measurement: "%"
    icon: "mdi:puzzle-outline"
    update_interval: 10s
    accuracy_decimals: 1
    lambda: |-
      float free_heap = heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);
      float largest_block = heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);
      
      if (free_heap > 0) {
        return 100.0 - ((largest_block / free_heap) * 100.0);
      }
      return 0.0;

interval:
  # ---------------------------------------------------------
  # COPROCESSOR LISTENER (Runs every 100ms)
  # ---------------------------------------------------------
  - interval: 100ms
    then:
      - lambda: |-
          static std::string line = "";
          
          while (id(coproc_uart).available()) {
            uint8_t c;
            id(coproc_uart).read_byte(&c);
            
            if (c == '\n') {
              // We received a full line! Check if it's a RAD reading.

              if (line.rfind("RAD:", 0) == 0) { 
                // Extract the number (everything after "RAD:")
                int rads = atoi(line.substr(4).c_str());
                
                // --- NEW: Radiation Smoothing Logic ---
                if (rads > 25) {
                  id(consecutive_high_rads) += 1;
                  if (id(consecutive_high_rads) >= 3) {
                    id(is_exposed) = true;
                  }
                } else {
                  // Reset immediately if rads drop to 25 or below
                  id(consecutive_high_rads) = 0;
                  id(is_exposed) = false;
                }

                // 1. Update the graphical needle
                lv_meter_set_indicator_value(id(rad_meter), id(rad_needle), rads);
                
                // 2. Update the text label
                lv_label_set_text_fmt(id(rad_label), "%d", rads);

                // 3. ---> NEW: Send the value to Home Assistant <---
                id(current_rads).publish_state(rads);
              }
              // Clear the buffer for the next message
              line = "";
            } else {
              // Keep adding characters until we hit the newline
              line += (char)c;
            }
          }
# --- HP DRAIN (Every 3 seconds) ---
  - interval: 3s
    then:
      - if:
          condition:
            lambda: 'return id(is_exposed) && id(vault_hp) > 0;'
          then:
            - lambda: |-
                id(vault_hp) -= 1;
                lv_label_set_text_fmt(id(ui_hp_label), "%d", id(vault_hp));
                id(telemetry_hp).publish_state(id(vault_hp)); 

  # --- HP RECOVERY (Every 10 seconds) ---
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return !id(is_exposed) && id(vault_hp) < 100;'
          then:
            - lambda: |-
                id(vault_hp) += 1;
                lv_label_set_text_fmt(id(ui_hp_label), "%d", id(vault_hp));
                id(telemetry_hp).publish_state(id(vault_hp));

  # --- PUZZLE TIMER (Every 1 second) ---
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(puzzle_is_open);'
          then:
            - lambda: |-
                // Check fail conditions: Time runs out OR radiation is lost
                if (id(active_puzzle_timer) <= 0 || !id(is_exposed)) {
                  id(puzzle_is_open) = false;
                  
                  // Hide the puzzle overlay
                  lv_obj_add_flag(id(inv_puzzle_overlay), LV_OBJ_FLAG_HIDDEN);
                  
                  ESP_LOGI("ROBCO", "Puzzle aborted. Time expired or radiation lost.");
                } else {
                  // Decrease the timer
                  id(active_puzzle_timer) -= 1;
                  
                  // Update the timer label on the screen (we will build this label next)
                  lv_label_set_text_fmt(id(lbl_puzzle_timer), "00:%02d", id(active_puzzle_timer));
                }

