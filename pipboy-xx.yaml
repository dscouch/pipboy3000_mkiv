# =========================================
# SYSTEM SCRIPTS
# =========================================
script:
  - id: robco_boot_sequence
    then:
      # 1. Show the blank boot screen
      - lvgl.page.show: boot_screen
      - delay: 500ms
      
      # 2. Loop through the array of text
      - while:
          condition:
            lambda: |-
              return id(boot_step) < 13; 
          then:
            # Grab the next line and add it to our text buffer
            - lambda: |-
                std::vector<std::string> lines = {
                  "****** PIP-OS(R) ${pip_version} *******\n",
                  "COPYRIGHT 2075 ROBCO(R)\n",
                  "LOADER V1.1\n",
                  "EXEC VERSION 41.10\n",
                  "64K RAM SYSTEM\n",
                  "38911 BYTES FREE\n",
                  "NO HOLOTAPE FOUND\n",
                  "Pip-Boy 3000 Mark IV\n",
                  "\n",
                  "Initializing Biometrics...\n",
                  " --- Please stop struggling ---\n",
                  "Subject: Dweller: ${dweller_id}\n",
                  "Biometrics Initialized.",
                  "Calibrating geiger counter... OK\n"
                };
                id(boot_buffer) += lines[id(boot_step)];
                id(boot_step)++; 
                
            # Push the updated buffer to the LVGL label
            - lvgl.label.update:
                id: ui_boot_text
                text: !lambda "return id(boot_buffer).c_str();"
                
            # The speed at which new lines appear
            - delay: 20ms #2s to be annoying
            
      # 3. Hold for dramatic effect when finished
      - delay: 2s  #5s to be annoying
          
      # --- BRANCH THE TIMELINE: ALIVE VS DEAD ---
      - if:
          condition:
            lambda: 'return id(is_dead) || id(vault_hp) <= 0;'
          then:
            # DEAD: Skip the image, skip grid initialization, proceed to cloning
            - script.execute: initiate_death_sequence
          else:
            # ALIVE: Proceed with the normal happy boot sequence
            # Swap to the thumbs up image
            - lambda: |-
                lv_obj_add_flag(id(ui_boot_text), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(ui_boot_image), LV_OBJ_FLAG_HIDDEN);
                
            - delay: 5s

            # 4. INITIALIZE GRIDS & LOGIC BEFORE SHOWING THE UI!
            - lambda: |-

                // ---> FORCE THE TAB UNDERLINE COLOR <---
                // (YAML doesn't support LV_PART_INDICATOR on tabviews yet)
                lv_obj_t * tab_btns = lv_tabview_get_tab_btns(id(main_tabs));
                lv_obj_set_style_bg_color(tab_btns, lv_color_hex(0x00FF00), (uint32_t)LV_PART_INDICATOR | (uint32_t)LV_STATE_CHECKED);
                lv_obj_set_style_height(tab_btns, 2, (uint32_t)LV_PART_INDICATOR | (uint32_t)LV_STATE_CHECKED);
                
                // ---> ANNIHILATE THE BLUE INDICATOR LINE & FOCUS RINGS <---
                //lv_obj_t * tab_btns = lv_tabview_get_tab_btns(id(main_tabs));
                
                // Set the indicator height to 0 across ALL states
                //lv_obj_set_style_height(tab_btns, 0, (uint32_t)LV_PART_INDICATOR | (uint32_t)LV_STATE_ANY);
                
                // Ensure the outline (focus ring) is dead across ALL states
                //lv_obj_set_style_outline_width(tab_btns, 0, (uint32_t)LV_PART_ITEMS | (uint32_t)LV_STATE_ANY);

                // Generate the initial text map with the brackets
                static char init_labels[16][8];
                static const char *init_map[21]; 
                int p = 0;
                for (int i = 0; i < 16; i++) {
                  if (id(locked_cells)[i]) {
                    sprintf(init_labels[i], "[%02X]", id(hex_grid)[i]);
                  } else if (i == 0) {
                    sprintf(init_labels[i], "*%02X*", id(hex_grid)[i]);
                  } else {
                    sprintf(init_labels[i], " %02X ", id(hex_grid)[i]);
                  }
                  init_map[p++] = init_labels[i];
                  if ((i + 1) % 4 == 0 && i != 15) init_map[p++] = "\n";
                }
                init_map[p] = ""; 
                lv_btnmatrix_set_map(id(memory_core_grid).obj, init_map);

                // ---> DYNAMIC LABELS FOR THE EXPERT MANUAL <---
                // We use the single-word button names here
                static const char * doc_1_btn = (std::string("${dweller_id}") == "793") ? "GAMMA" : "PORTS";
                static const char * doc_2_btn = (std::string("${dweller_id}") == "793") ? "DELTA" : "CIPHER";
                static const char * map_labels[] = {"MAP 1", "\n", "MAP 2", "\n", "MAP 3", "\n", doc_1_btn, "\n", doc_2_btn, ""};
                lv_btnmatrix_set_map(id(map_side_menu).obj, map_labels);

                // >>> [SYS-DOC-INIT] Inject initial DOC text from globals <<<
                lv_label_set_text(id(doc_a_text), id(doc_a_text_original).c_str());
                lv_label_set_text(id(doc_b_text), id(doc_b_text_original).c_str());

                // Enable the Geiger Counter settings & flip the UI switches!
                id(rad_sound_enabled) = true;
                id(rad_haptic_enabled) = true;
                lv_obj_add_state(id(switch_rad_sound), LV_STATE_CHECKED);
                lv_obj_add_state(id(switch_rad_haptic), LV_STATE_CHECKED);

            # Start Vault Boy Animation
            - lvgl.animimg.start: vault_boy_anim

            # 5. Launch the UI!
            - lvgl.page.show: main_interface

            # 6. Animate the Rad Meter Needle (Calibration Test)
            - lambda: |-
                lv_anim_t a;
                lv_anim_init(&a);
                lv_anim_set_var(&a, id(rad_needle));
                // Move from 0 to the maximum value of 50
                lv_anim_set_values(&a, 0, 50);
                // Set the time for the upward movement (800 milliseconds)
                lv_anim_set_time(&a, 800); 
                // Set the time for the downward movement (800 milliseconds)
                lv_anim_set_playback_time(&a, 800); 
                // Add a brief pause at the top before it falls back down
                lv_anim_set_playback_delay(&a, 200); 
                // Use a smooth movement curve
                lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out); 
                // Tell the animation how to update the needle position
                lv_anim_set_exec_cb(&a, [](void * var, int32_t v) {
                    lv_meter_set_indicator_value(id(rad_meter), (lv_meter_indicator_t *)var, v);
                });
                
                // Start the animation
                lv_anim_start(&a);
                
                // Start the sound and haptic
                id(coproc_uart).write_str("SND:1\n");
                id(coproc_uart).write_str("HAP:1\n");

            # 7. Sync Initial Inventory Visibility
            - lambda: |-
                // Sync Cache Alpha from Home Assistant
                if (id(ha_solved_alpha).state) {
                  lv_obj_clear_flag(id(btn_inv_0), LV_OBJ_FLAG_HIDDEN);
                } else {
                  lv_obj_add_flag(id(btn_inv_0), LV_OBJ_FLAG_HIDDEN);
                }
                
                // Sync Beta, Charlie, and Delta from local device memory
                if (id(inv_solved)[1]) lv_obj_clear_flag(id(btn_inv_1), LV_OBJ_FLAG_HIDDEN);
                if (id(inv_solved)[2]) lv_obj_clear_flag(id(btn_inv_2), LV_OBJ_FLAG_HIDDEN);
                if (id(inv_solved)[3]) lv_obj_clear_flag(id(btn_inv_3), LV_OBJ_FLAG_HIDDEN);

  # =========================================
  # REWARDS AND GAMEPLAY SCRIPTS
  # =========================================

  - id: unlock_cache_alpha
    then:
      - homeassistant.service:
          service: input_boolean.turn_on
          data:
            entity_id: input_boolean.cache_alpha_solved

  - id: add_xp
    parameters:
      amount: int
    then:
      - lambda: |-
          id(vault_xp) += amount;
          lv_label_set_text_fmt(id(ui_xp_label), "%d", id(vault_xp));
          
          // Notify Home Assistant about the new total
          id(ha_xp_control).publish_state(id(vault_xp));
          
          ESP_LOGI("ROBCO", "XP Added: %d. Total XP: %d", amount, id(vault_xp));

  # >>> [SYS-GAME-PUZ] Seed selection (no immediate repeats) <<<
  - id: puzzle_pick_new_seed
    parameters:
      puzzle_id: int   # 0..3
      variant_count: int  # e.g. 4
    then:
      - lambda: |-
          int last = id(last_puzzle_seed)[puzzle_id];
          int seed = esp_random() % variant_count;

          // If there is only 1 variant, repetition is unavoidable
          if (variant_count > 1) {
            // Re-roll until different (small loop, cheap)
            while (seed == last) {
              seed = esp_random() % variant_count;
            }
          }

          id(last_puzzle_seed)[puzzle_id] = seed;
          id(current_puzzle_seed) = seed;

          ESP_LOGI("PUZ", "Puzzle %d new seed=%d (last=%d)", puzzle_id, seed, last);

  # >>> [SYS-GAME-PUZ] Close the puzzle UI overlay (always safe to call) <<<
  - id: puzzle_ui_close
    then:
      - lambda: |-
          id(puzzle_is_open) = false;
          id(active_puzzle_timer) = 10;
          // Hide overlay
          lv_obj_add_flag(id(inv_puzzle_overlay), LV_OBJ_FLAG_HIDDEN);
          // Hide all puzzle containers (future-proof)
          lv_obj_add_flag(id(puzzle_alpha_container), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(puzzle_beta_container), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(puzzle_charlie_container), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(puzzle_delta_container), LV_OBJ_FLAG_HIDDEN);

  # >>> [SYS-GAME-PUZ] Unified puzzle exit handler <<<
  # reason codes:
  # 0 = success
  # 1 = wrong input (penalty)
  # 2 = timeout (no penalty)
  # 3 = exposure lost (no penalty)
  - id: puzzle_exit
    parameters:
      puzzle_id: int
      reason: int
    then:
      - lambda: |-
          ESP_LOGI("PUZ", "Exit puzzle=%d reason=%d", puzzle_id, reason);

      # Always close UI first (prevents double-click edge cases)
      - script.execute: puzzle_ui_close

      # >>> [SYS-GAME-PUZ] Wrong input penalty <<<
      - if:
          condition:
            lambda: 'return reason == 1;'
          then:
            - script.execute: puzzle_failed_penalty

      # >>> [SYS-GAME-PUZ] Success handling (unlock + HA notify) <<<
      - if:
          condition:
            lambda: 'return reason == 0;'
          then:
            - lambda: |-
                // Mark solved
                if (puzzle_id >= 0 && puzzle_id < 4) {
                  id(inv_solved)[puzzle_id] = true;
                }

                // Reveal inventory button locally
                if (puzzle_id == 0) {
                  // Alpha is HA-shared in your current design
                  // Button reveal is already tied to ha_solved_alpha
                } else if (puzzle_id == 1) {
                  lv_obj_clear_flag(id(btn_inv_1), LV_OBJ_FLAG_HIDDEN);
                } else if (puzzle_id == 2) {
                  lv_obj_clear_flag(id(btn_inv_2), LV_OBJ_FLAG_HIDDEN);
                } else if (puzzle_id == 3) {
                  lv_obj_clear_flag(id(btn_inv_3), LV_OBJ_FLAG_HIDDEN);
                }

            # Optional XP award hook (you can tune per puzzle later)
            - script.execute:
                id: add_xp
                amount: 50

            # Notify Home Assistant for solved state (define these entities later)
            # Alpha uses unlock_cache_alpha already; keep that special-case.
            - if:
                condition:
                  lambda: 'return puzzle_id == 0;'
                then:
                  - script.execute: unlock_cache_alpha
                else:
                  # For Beta/Charlie/Delta you can either:
                  # A) publish to HA via input_boolean per puzzle, or
                  # B) keep local only (current design)
                  - lambda: |-
                      ESP_LOGI("PUZ", "Puzzle %d solved (local). Add HA notify if desired.", puzzle_id);

#  PUZZLE FAILED PENALTY
  - id: puzzle_failed_penalty
    then:
      - lambda: |-
          // Deduct HP and instantly close the puzzle overlay
          id(vault_hp) -= 25;
          id(puzzle_is_open) = false;
          lv_obj_add_flag(id(inv_puzzle_overlay), LV_OBJ_FLAG_HIDDEN);
          
          if (id(vault_hp) <= 0) {
            // They died. Send them to cloning immediately.
            id(initiate_death_sequence).execute();
          } else {
            // They survived. Update the HP screen and HA.
            lv_label_set_text_fmt(id(ui_hp_label), "%d", id(vault_hp));
            id(telemetry_hp).publish_state(id(vault_hp));
            
            // Fix the close button on the error message box
            lv_obj_t * close_btn = lv_msgbox_get_close_btn(id(msgbox_error));
            if (close_btn != NULL) {
              lv_obj_set_style_bg_color(close_btn, lv_color_hex(0x000000), 0);
              lv_obj_set_style_text_color(close_btn, lv_color_hex(0xFF0000), 0);
              
              lv_obj_t * close_label = lv_obj_get_child(close_btn, 0);
              if (close_label != NULL) {
                lv_label_set_text(close_label, "X");
              }
            }
          }
          
      # Show the error pop-up ONLY if they are still alive
      - if:
          condition:
            lambda: 'return id(vault_hp) > 0;'
          then:
            - lvgl.widget.show: msgbox_error

  - id: initiate_death_sequence
    then:
      - lambda: |-
          id(is_dead) = true;
          id(death_countdown) = 99;
          
          id(vault_hp) = 0;
          id(telemetry_hp).publish_state(0);
          
      # Give the system 1 second to queue the new zero health state
      - delay: 1s
      
      # Now force the system to write the queue to permanent flash memory
      - lambda: 'global_preferences->sync();'
      
      - lvgl.page.show: death_screen

  # >>> [SYS-DOC-GLITCH] Visual corruption effect <<< 
  - id: glitch_doc_display
    parameters:
      target_label: lv_obj_t*
    then:
      - repeat:
          count: 10
          then:
            - lambda: |-
                const char* chars = "!@#$%^&*()_+-=[]{}|;:,.<>?";
                char glitch[16];
                for (int i = 0; i < 15; i++) glitch[i] = chars[esp_random() % 26];
                glitch[15] = '\0';
                lv_label_set_text(target_label, glitch);
            - delay: 50ms
      - lambda: |-
          lv_label_set_text(target_label, "DATA CORRUPTED:\nRAD LEVEL CRITICAL");

  # RADIATION EXPOSURE HANDLING
  - id: on_enter_exposed
    then:
      - lambda: |-
          // >>> [SYS-DOC-STATE] Enter exposure – corrupt visible DOCs <<<
          ESP_LOGI("DOC", "Exposure entered – corrupting visible DOCs (if open)");

          // If DOC A page is currently visible, glitch its text
          if (!lv_obj_has_flag(id(doc_a_page), LV_OBJ_FLAG_HIDDEN)) {
            id(glitch_doc_display).execute(id(doc_a_text));
          }

          // If DOC B page is currently visible, glitch its text
          if (!lv_obj_has_flag(id(doc_b_page), LV_OBJ_FLAG_HIDDEN)) {
            id(glitch_doc_display).execute(id(doc_b_text));
          }

  - id: on_exit_exposed
    then:
      - lambda: |-
          // >>> [SYS-DOC-STATE] Exit exposure – restore DOC text <<<
          ESP_LOGI("DOC", "Exposure ended – restoring DOC text");

      # >>> [SYS-DOC-RESTORE] Restore DOC A/B text <<<
      - lvgl.label.update:
          id: doc_a_text
          text: !lambda |-
            return id(doc_a_text_original).c_str();

      - lvgl.label.update:
          id: doc_b_text
          text: !lambda |-
            return id(doc_b_text_original).c_str();

switch:
  - platform: template
    name: "Puzzle Cheat Mode"
    id: ha_cheat_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# =========================================
# SYSTEM CONTROLS
# =========================================
button:
  - platform: restart
    name: "Pip-Boy Reboot"
    id: sys_restart_btn

binary_sensor:
  # =========================================
  # SHARED PUZZLE MEMORY (HOME ASSISTANT)
  # =========================================
  - platform: homeassistant
    name: "Cache Alpha Sync"
    id: ha_solved_alpha
    entity_id: input_boolean.cache_alpha_solved
    on_state:
      - if:
          condition:
            binary_sensor.is_on: ha_solved_alpha
          then:
            - lambda: |-
                // Reveal the button when the puzzle is complete
                lv_obj_clear_flag(id(btn_inv_0), LV_OBJ_FLAG_HIDDEN);
          else:
            - lambda: |-
                // Hide the button if the puzzle resets
                lv_obj_add_flag(id(btn_inv_0), LV_OBJ_FLAG_HIDDEN);

# =========================================
# SENSORS (Abridged to essentials for compilation)
# =========================================
sensor:
  - platform: template
    name: "Pip-Boy HP"
    id: telemetry_hp
    lambda: 'return id(vault_hp);'
    update_interval: 2s
  - platform: template
    name: "Pip-Boy Radiation Level"
    id: current_rads
    unit_of_measurement: "RAD"

  # =========================================
  # SYSTEM DIAGNOSTICS
  # =========================================
  - platform: template
    name: "Pip-Boy Free Internal Heap"
    id: diag_free_heap
    unit_of_measurement: "B"
    icon: "mdi:memory"
    update_interval: 10s
    accuracy_decimals: 0
    lambda: |-
      return heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);

  - platform: template
    name: "Pip-Boy Largest Free Block"
    id: diag_largest_block
    unit_of_measurement: "B"
    icon: "mdi:memory"
    update_interval: 10s
    accuracy_decimals: 0
    lambda: |-
      return heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);

  - platform: template
    name: "Pip-Boy Heap Fragmentation"
    id: diag_heap_frag
    unit_of_measurement: "%"
    icon: "mdi:puzzle-outline"
    update_interval: 10s
    accuracy_decimals: 1
    lambda: |-
      float free_heap = heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);
      float largest_block = heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);
      
      if (free_heap > 0) {
        return 100.0 - ((largest_block / free_heap) * 100.0);
      }
      return 0.0;

interval:
  # ---------------------------------------------------------
  # COPROCESSOR LISTENER (Runs every 100ms)
  # ---------------------------------------------------------
  - interval: 100ms
    then:
      - lambda: |-
          static std::string line = "";
          
          while (id(coproc_uart).available()) {
            uint8_t c;
            id(coproc_uart).read_byte(&c);
            
            if (c == '\n') {
              // We received a full line! Check if it's a RAD reading.

              ESP_LOGW("COPROC_RAW", "UART LINE: '%s'", line.c_str());

              if (line.rfind("RAD:", 0) == 0) { 
                // Extract the number (everything after "RAD:")
                int rads = atoi(line.substr(4).c_str());

                // --- [SYS-RAD-SM] Exposure State Machine (3-up / 3-down with deadband) ---
                const int ENTER_T = 26;   // >= enters exposure (tune here)
                const int EXIT_T  = 24;   // <= exits exposure  (tune here)

                // Update exposure counter
                if (rads >= ENTER_T) {
                  id(consecutive_high_rads) += 1;
                  if (id(consecutive_high_rads) > 3) id(consecutive_high_rads) = 3;
                } else if (rads <= EXIT_T) {
                  id(consecutive_high_rads) -= 1;
                  if (id(consecutive_high_rads) < 0) id(consecutive_high_rads) = 0;
                } else {
                  // In the deadband, do not change the counter
                }

                // Transition detection (hooks)
                if (!id(is_exposed) && id(consecutive_high_rads) >= 3) {
                  id(is_exposed) = true;
                  id(on_enter_exposed).execute();
                } else if (id(is_exposed) && id(consecutive_high_rads) == 0) {
                  id(is_exposed) = false;
                  id(on_exit_exposed).execute();
                }

                // 1. Update the graphical needle
                lv_meter_set_indicator_value(id(rad_meter), id(rad_needle), rads);
                
                // 2. Update the text label
                lv_label_set_text_fmt(id(rad_label), "%d", rads);

                // 3. ---> NEW: Send the value to Home Assistant <---
                id(current_rads).publish_state(rads);
              } // <--- THIS BRACE WAS MISSING

              // NEW: Handle Battery Data
              else if (line.rfind("BATRAW:", 0) == 0) {

                // 1) Raw ADC pin voltage from coprocessor
                float adc_v = atof(line.substr(7).c_str());

                // 2) Apply per-device calibration offset
                float adc_v_cal = adc_v + id(batt_adc_offset);

                // 3) Convert to battery voltage (2:1 divider)
                float batt_v = adc_v_cal * 2.0f;

                // 4) Convert to percentage (LiPo range)
                int percent = (int)(((batt_v - 3.2f) / (4.2f - 3.2f)) * 100.0f);
                if (percent > 100) percent = 100;
                if (percent < 0) percent = 0;

                // 5) Update UI
                lv_bar_set_value(id(ui_battery_bar), percent, LV_ANIM_OFF);
                lv_label_set_text_fmt(id(ui_battery_label), "%d%%", percent);

                // 6) Debug log (very helpful)
                ESP_LOGD(
                  "battery",
                  "BATRAW=%.3fV ADC_CAL=%.3fV VBAT=%.3fV (%d%%)",
                  adc_v,
                  adc_v_cal,
                  batt_v,
                  percent
                );
              }
              // Clear the buffer for the next message
              line = "";
            } else {
              // Keep adding characters until we hit the newline
              line += (char)c;
            }
          }
# --- HP DRAIN (Every 3 seconds) ---
  - interval: 3s
    then:
      - if:
          condition:
            lambda: 'return id(is_exposed) && id(vault_hp) > 0 && !id(is_dead);'
          then:
            - lambda: |-
                id(vault_hp) -= 1;
                
                if (id(vault_hp) <= 0) {
                  id(initiate_death_sequence).execute();
                } else {
                  lv_label_set_text_fmt(id(ui_hp_label), "%d", id(vault_hp));
                  id(telemetry_hp).publish_state(id(vault_hp)); 
                }


# --- HP RECOVERY (Every 10 seconds) ---
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return !id(is_exposed) && id(vault_hp) < 100 && !id(is_dead) && id(vault_hp) > 0;'
          then:
            - lambda: |-
                id(vault_hp) += 1;
                lv_label_set_text_fmt(id(ui_hp_label), "%d", id(vault_hp));
                id(telemetry_hp).publish_state(id(vault_hp));

# --- PUZZLE TIMER (Every 1 second) ---
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(puzzle_is_open);'
          then:
            - lambda: |-
                bool cheat_active = id(ha_cheat_mode).state;
                
                // Check fail conditions: Time expires OR radiation is lost
                if (!cheat_active && (id(active_puzzle_timer) <= 0 || !id(is_exposed))) {
                  id(puzzle_is_open) = false;
                  
                  // Hide the puzzle overlay
                  lv_obj_add_flag(id(inv_puzzle_overlay), LV_OBJ_FLAG_HIDDEN);
                  
                  ESP_LOGI("ROBCO", "Puzzle aborted. Time expired or radiation lost.");
                } else {
                  // Decrease the timer only if cheat mode is disabled
                  if (!cheat_active && id(active_puzzle_timer) > 0) {
                    id(active_puzzle_timer) -= 1;
                  }
                  
                  // Update the timer label on the screen
                  lv_label_set_text_fmt(id(lbl_puzzle_timer), "00:%02d", id(active_puzzle_timer));
                }

# --- CLONING TIMER (Every 1 second) ---
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(is_dead) && id(death_countdown) > 0;'
          then:
            - lambda: |-
                // 1. Decrease the timer
                id(death_countdown) -= 1;
                lv_label_set_text_fmt(id(ui_death_timer), "T-MINUS %02ds", id(death_countdown));
                
            # 2. Did the timer just hit zero?
            - if:
                condition:
                  lambda: 'return id(death_countdown) <= 0;'
                then:
                  - lambda: |-
                      // Restore the vitals
                      id(is_dead) = false;
                      id(vault_hp) = 50;
                      id(telemetry_hp).publish_state(50);
                      ESP_LOGI("ROBCO", "Cloning complete. Saving and rebooting...");
                      
                  # Wait 1 second for the new variables to queue
                  - delay: 1s
                  
                  # Force the permanent save
                  - lambda: 'global_preferences->sync();'
                  
                  # Wait 1 second to ensure the save finishes, then reboot
                  - delay: 1s
                  - button.press: sys_restart_btn

# =========================================
# DISPLAY CONFIGURATION
# =========================================

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  bg_color: 0x000000
  msgboxes:
    - id: msgbox_alpha
      title: "CACHE ALPHA DATA"
      close_button: true
      # Force the Pip-Boy styles on the main box
      bg_color: 0x000000
      border_width: 2
      border_color: pip_bright
      text_color: pip_bright
      text_font: pip_sub_font
      body:
        text: "AWAITING CORRELATION"
        text_font: pip_sub_font
        text_color: pip_bright
    - id: msgbox_error
      title: "SECURITY ALERT"
      close_button: true
      bg_color: 0x220000  # Dark red background
      border_width: 2
      border_color: pip_alert
      text_color: pip_alert
      text_font: pip_sub_font
      body:
        text: "INVALID DECRYPTION SEQUENCE.\n\nCOUNTERMEASURES DEPLOYED:\n25 HP DEDUCTED."

  # =========================================
  # GLOBAL LVGL STYLES & THEMES
  # =========================================
  theme:
    label:
      text_font: pip_main_font
      text_color: pip_bright
    button:
      bg_color: 0x000000
      shadow_width: 0
      border_color: pip_unselected
      border_width: 1
      text_font: pip_sub_font
      text_color: pip_unselected
      pressed: # set some button colors to be different in pressed state
        bg_color: 0x006600
        text_color: pip_bright
      checked: # set some button colors to be different in checked state
        bg_color: 0x006600
        text_color: pip_bright
    buttonmatrix:
      bg_color: 0x000000
      border_width: 0
      items:
        bg_color: 0x000000
        text_color: 0x009900  
        text_font: pip_main_font
        border_color: 0x003300
        border_width: 2
        shadow_width: 0
        # State modifiers go HERE, where the style is applied!
        checked:
          bg_color: 0x003300
          text_color: pip_bright
    switch:
      bg_color: pip_line
      indicator:
        bg_color: pip_line
        checked:
          bg_color: pip_bright
      knob:
        bg_color: 0x000000

  pages:
    # ==========================================
    # PAGE 0: THE ROBCO BOOT SEQUENCE
    # ==========================================

    - id: boot_screen
      bg_color: 0x000000
      widgets:
        - label:
            id: ui_boot_text
            text: ""   # Starts completely blank
            x: 220      # Gives it a nice command-line margin
            y: 20
            width: 560 # Keeps it from wrapping off-screen
            text_font: pip_sub_font
        
        # --- NEW: BOOT LOGO ---
        - image:
            id: ui_boot_image
            src: img_vaultboy_thumbsup
            x: 270      # Gives it a nice command-line margin
            y: 20
            hidden: true  # Hide it while the text is typing

    # ==========================================
    # PAGE 1: THE MAIN PIP-BOY INTERFACE
    # ==========================================
    - id: main_interface
      bg_color: 0x000000
      widgets:
        
        # --- THE PERSISTENT FOOTER ---
        - label:
            text: "HP:"
            x: 240
            y: 445
        - label:
            id: ui_hp_label  # <-- NEW ID
            text: "100"
            x: 290
            y: 445
        - label:
            text: ${pip_version}
            x: 365   # Moved left from 425
            y: 450
            text_color: pip_unselected
            text_font: pip_sub_font
        # ---> NEW: BATTERY METER <---
        - bar:
            id: ui_battery_bar
            x: 495
            y: 445
            width: 100
            height: 30
            min_value: 0
            max_value: 100
            value: 100
            bg_color: 0x006600 
            indicator:
              bg_color: pip_bright
        # The Lightning Bolt Overlay 
        - label:
            text: "\uF0E7"            # The LVGL charge symbol
            x: 505                   # Positioned 10 pixels from the left edge of the bar
            y: 447                   # Aligned to sit inside the bar
            text_color: 0x000000     # Black colour
            text_font: montserrat_26 # Forces the internal font
        - label:
            id: ui_battery_label
            text: "100%"
            x: 605
            y: 450
            text_color: pip_unselected
            text_font: pip_sub_font
            
        - label:
