                      hidden: true
                      scrollable: false
                      widgets:
                        - label: { text: "FLOOR PLAN 3", x: 120, y: 10 }
                        - image: { src: map_img_3, x: 10, y: 50 }
                        - obj: { id: map3_rad_led, x: 280, y: 250, width: 20, height: 20, bg_color: pip_alert, border_width: 0, radius: 10 }
                        - obj: { id: map3_rad2_led, x: 85, y: 105, width: 20, height: 20, bg_color: pip_alert, border_width: 0, radius: 10 }

                  # --- DOC A PAGE (Hidden) ---
                  - obj:
