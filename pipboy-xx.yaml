                            widgets:
                              # --- THE MAP SIDE NAVIGATION MENU ---
                              - buttonmatrix: 
                                  id: map_side_menu
                                  x: 10
                                  y: 0
                                  width: 160
                                  height: 395
                                  one_checked: true
                                  items:
                                    text_font: pip_sub_font
                                  # Temporary labels. The boot sequence C++ will override DOC A & B
                                  rows:
                                    - buttons:
                                      - text: "MAP 1"
                                        control: { checkable: true, checked: true }
                                    - buttons:
                                      - text: "MAP 2"
                                        control: { checkable: true, checked: false }
                                    - buttons:
                                      - text: "MAP 3"
                                        control: { checkable: true, checked: false }
                                    - buttons:
                                      - text: "DOC A"
                                        control: { checkable: true, checked: false }
                                    - buttons:
                                      - text: "DOC B"
                                        control: { checkable: true, checked: false }
                                  on_click:
                                    - lambda: |-
                                        // MAP side menu click handler (compiles with current ESPHome LVGL)
                                        uint16_t btn_id = id(map_side_menu)->get_selected();  // <-- get_selected(), not get_selected_btn()
                                        if (btn_id == LV_BTNMATRIX_BTN_NONE) return;

                                        // Hide all pages first (LVGL C API)
                                        lv_obj_add_flag(id(map1_page), LV_OBJ_FLAG_HIDDEN);
                                        lv_obj_add_flag(id(map2_page), LV_OBJ_FLAG_HIDDEN);
                                        lv_obj_add_flag(id(map3_page), LV_OBJ_FLAG_HIDDEN);
                                        lv_obj_add_flag(id(doc_a_page), LV_OBJ_FLAG_HIDDEN);
                                        lv_obj_add_flag(id(doc_b_page), LV_OBJ_FLAG_HIDDEN);

                                        // Show selected page
                                        if (btn_id == 0) {
                                          lv_obj_clear_flag(id(map1_page), LV_OBJ_FLAG_HIDDEN);
                                        } else if (btn_id == 1) {
                                          lv_obj_clear_flag(id(map2_page), LV_OBJ_FLAG_HIDDEN);
                                        } else if (btn_id == 2) {
                                          lv_obj_clear_flag(id(map3_page), LV_OBJ_FLAG_HIDDEN);
                                        } else if (btn_id == 3) {
                                          // >>> [SYS-UI-MAP] DOC SLOT 1 (DOC A) access + renderer switch <<<
                                          lv_obj_clear_flag(id(doc_a_page), LV_OBJ_FLAG_HIDDEN);

                                          // Switch renderer: plain text vs Delta manual layout
                                          if (id(doc_slot1_is_delta)) {
                                            // Show Delta layout for slot 1, hide plain text label
                                            lv_obj_add_flag(id(doc_a_text), LV_OBJ_FLAG_HIDDEN);
                                            lv_obj_clear_flag(id(delta_manual_slot2), LV_OBJ_FLAG_HIDDEN);

                                            // Only populate if NOT exposed
                                            if (!id(is_exposed)) {
                                              id(delta_manual_populate).execute();
                                            }

                                            // If exposed, corrupt instead
                                            if (id(is_exposed)) {
                                              id(delta_manual_corrupt).execute();
                                            }
                                          } else {
                                            // Show plain text label, hide Delta layout
                                            lv_obj_clear_flag(id(doc_a_text), LV_OBJ_FLAG_HIDDEN);
                                            lv_obj_add_flag(id(delta_manual_slot1), LV_OBJ_FLAG_HIDDEN);

                                            // Only glitch the plain text doc
                                            if (id(is_exposed)) {
                                              id(glitch_doc_display).execute(id(doc_a_text));
                                            }
                                          }
                                        } else if (btn_id == 4) {
                                          // >>> [SYS-UI-MAP] DOC SLOT 2 (DOC B) access + renderer switch <<<
                                          lv_obj_clear_flag(id(doc_b_page), LV_OBJ_FLAG_HIDDEN);

                                          // Switch renderer: plain text vs Delta manual layout
                                          if (id(doc_slot2_is_delta)) {
                                            // Show Delta layout for slot 2, hide plain text label
                                            lv_obj_add_flag(id(doc_b_text), LV_OBJ_FLAG_HIDDEN);
                                            lv_obj_clear_flag(id(delta_manual_slot2), LV_OBJ_FLAG_HIDDEN);

                                            // Only populate if NOT exposed
                                            if (!id(is_exposed)) {
                                              id(delta_manual_populate).execute();
                                            }

                                            // If exposed, corrupt instead
                                            if (id(is_exposed)) {
                                              id(delta_manual_corrupt).execute();
                                            }
                                          } else {
                                            // Show plain text label, hide Delta layout
                                            lv_obj_clear_flag(id(doc_b_text), LV_OBJ_FLAG_HIDDEN);
                                            lv_obj_add_flag(id(delta_manual_slot2), LV_OBJ_FLAG_HIDDEN);

                                            // Only glitch the plain text doc
                                            if (id(is_exposed)) {
                                              id(glitch_doc_display).execute(id(doc_b_text));
                                            }
                                          }
                                        }

