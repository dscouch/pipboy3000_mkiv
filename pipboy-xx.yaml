                            if (id(locked_cells)[btn_id]) {
                              ESP_LOGW("ROBCO", "ACCESS DENIED: Cell %d is locked.", btn_id);
                              return; 
                            }

                            int val = id(hex_grid)[btn_id];
                            val += id(input_direction); 
                            
                            if (val > 15) val = 0;
                            if (val < 0) val = 15;
                            id(hex_grid)[btn_id] = val;
                            
                            // Rebuild the LVGL Button Map with Brackets for locked cells!
                            static char btn_labels[16][8]; // Increased buffer for brackets
                            static const char *new_map[21]; 
                            
                            int map_pos = 0;
                            for (int i = 0; i < 16; i++) {
                              if (id(locked_cells)[i]) {
                                sprintf(btn_labels[i], "[%02X]", id(hex_grid)[i]);
                              } else if (i == 0) { // Cell 00 is linked to the other Pip-Boy
