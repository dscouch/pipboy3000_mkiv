esphome:
  name: esphome-web-6e554c
  friendly_name: CYDisplay
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  # 1. ENCRYPTION (Highly Recommended)
  # When you first created the device in the ESPHome dashboard, it generated a key.
  # If you don't have it, HA might prompt you to enter one when connecting.
  encryption:
    key: !secret pipboy_api_key 

  # 2. CUSTOM SERVICES (The "Game Master" Tools)
  services:
    - service: trigger_meltdown
      # You can call this service from Home Assistant to mess with them!
      then:
        - lambda: |-
            id(active_main_tab) = 0; // Force their screen to jump to the STAT tab
            id(vault_hp) -= 50;      // Cut their health in half
            ESP_LOGW("pipboy", "OVERSEER INITIATED REACTOR MELTDOWN!");

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

output:
  - platform: ledc
    pin: GPIO27
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON
    
spi:
  - id: bus_a
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
    interface: hardware

font:
  - file: "monofonto.otf"
    id: pip_main_font
    size: 24
    glyphs: 
      - ' !"%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
  - file: "monofonto.otf"
    id: pip_sub_font
    size: 18
    # Add this glyphs section:
    glyphs:
      - ' !"%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
      - 'Σ'  # Explicitly include the Sigma

color:
  - id: pip_bright
    red: 0%
    green: 100%
    blue: 0%
  - id: pip_unselected # Try about 60% bright for unselected text
    red: 0%
    green: 60%
    blue: 0%
  - id: pip_line # A faint green for overall row structure/lines
    red: 0%
    green: 20%
    blue: 0%

animation:
  - file: "vaultboy-thumbsup3-1.gif"  # "cat-walking.gif"
    id: vault_boy_anim
    type: RGB565 # Use 'BINARY' if you want that retro 1-color green look
    # resize: 120x120 # Optional: ESPHome can resize it for you

globals:
  lv_obj_t * rad_bar;
  lv_obj_t * rad_label;
  - id: active_main_tab
    type: int
    restore_value: no
    initial_value: '0' # 0=STAT, 1=INV, 2=DATA, 3=MAP, 4=RADIO
  - id: active_sub_tab
    type: int
    restore_value: no
    initial_value: '0' # 0=STATUS, 1=SPECIAL, 2=PERKS
  # The Hex Matrix Data
  - id: hex_grid
    type: std::vector<int>
    #initial_value: '{0x1, 0xA, 0x3, 0x4, 0x5, 0x2, 0x7, 0x8, 0x9, 0x6, 0xB, 0xC, 0xD, 0xE, 0xF, 0x0}'
    # This is exactly 1 tap away from winning. The last number is 0xF. 
    # Tap the bottom-right cell once to change it to 0x0 and trigger the win.
    initial_value: '{0xF, 0x2, 0x1, 0xC, 0x4, 0x9, 0xA, 0x7, 0x8, 0x5, 0x6, 0xB, 0x3, 0xE, 0xD, 0xF}'
  - id: locked_cells
    type: std::vector<bool>
    # Locks the 4 corners and a couple of middle cells to anchor the puzzle
    initial_value: '{true, false, false, true, false, true, false, false, false, false, true, false, true, false, false, true}'
  - id: target_sum
    type: int
    initial_value: '30' # Decimal 30 = 0x1E
  # The puzzle state tracker
  - id: data_solved
    type: bool
    initial_value: 'false'
    restore_value: no
  # The XP/RPG/HP tracker
  - id: vault_xp
    type: int
    initial_value: '0'
    restore_value: yes # 'yes' means it saves even if the Pip-Boy restarts!
  - id: vault_hp
    type: int
    initial_value: '100'
    restore_value: yes # Remembers health even if rebooted
  - id: meltdown_hold_time
    type: int
    initial_value: '0'
    restore_value: no

void create_rad_meter() {
    /* Create a style for the bar background */
    static lv_style_t style_bg;
    lv_style_init(&style_bg);
    lv_style_set_bg_color(&style_bg, lv_palette_main(LV_PALETTE_GREY));
    lv_style_set_border_width(&style_bg, 2);
    lv_style_set_border_color(&style_bg, lv_color_hex(0x00FF00)); // Classic Green

    /* Create a style for the indicator (the "filling") */
    static lv_style_t style_indic;
    lv_style_init(&style_indic);
    lv_style_set_bg_color(&style_indic, lv_color_hex(0x00FF00));
    lv_style_set_bg_opa(&style_indic, LV_OPA_COVER);

    /* Create the Bar object */
    rad_bar = lv_bar_create(lv_scr_act());
    lv_obj_add_style(rad_bar, &style_bg, 0);
    lv_obj_add_style(rad_bar, &style_indic, LV_PART_INDICATOR);
    
    // Position: Right side (x=240), Centered Vertically
    lv_obj_set_size(rad_bar, 20, 100); 
    lv_obj_align(rad_bar, LV_ALIGN_RIGHT_MID, -20, 0);
    lv_bar_set_range(rad_bar, 0, 50); // Matches our 0-50 Rads scale
    
    /* Add a "RADS" label above it */
    rad_label = lv_label_create(lv_scr_act());
    lv_label_set_text(rad_label, "RADS");
    lv_obj_align_to(rad_label, rad_bar, LV_ALIGN_OUT_TOP_MID, 0, -5);
}

sensor:
  - platform: template
    name: "Pip-Boy HP"
    id: telemetry_hp
    icon: "mdi:heart-pulse"
    unit_of_measurement: "HP"
    accuracy_decimals: 0
    lambda: |-
      return id(vault_hp);
    update_interval: 2s

  - platform: template
    name: "Pip-Boy XP"
    id: telemetry_xp
    icon: "mdi:star-shooting"
    unit_of_measurement: "XP"
    accuracy_decimals: 0
    lambda: |-
      return id(vault_xp);
    update_interval: 2s

  # Reads Player 1's Coolant Value
  - platform: homeassistant
    id: reactor_coolant
    entity_id: input_number.reactor_coolant
    internal: true

  # Reads Player 2's Rod Value
  - platform: homeassistant
    id: reactor_rods
    entity_id: input_number.reactor_rods
    internal: true

  # Looks for Radiation Source Proximity (bluetooth beacon)
  - platform: ble_rssi
    ibeacon_uuid: "ADDE6D48-8929-43D1-9B5F-00123456789A"
    name: "Pip-Boy Radiation Detector"
    id: radiation_sensor
    unit_of_measurement: "Rads/s"
    icon: "mdi:radioactive"
    update_interval: 0.5s # Fast updates for that twitchy needle feel
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
      - lambda: |-
          // Map RSSI (-95 to -40) to Rads (0.1 to 50.0)
          if (x < -90) return 0.1; 
          if (x > -40) return 50.0;
          
          // Exponential curve: Rads = 10^((RSSI + 100) / 20)
          // This makes the needle jump aggressively as you get close
          return pow(10, (x + 95.0) / 30.0); 
    on_value:
      then:
        - lambda: |-
            // Only update the screen if we are on the Status page
            // Assuming 'current_menu' is a global variable you use for navigation
            if (id(current_menu) == "STAT_STATUS") {
                lv_bar_set_value(rad_bar, x, LV_ANIM_ON);
                
                // Add a "jitter" effect to the label
                if (x > 0.5) {
                   lv_label_set_text_fmt(rad_label, "RADS: %.1f", x);
                } else {
                   lv_label_set_text(rad_label, "RADS: 0");
                }
            } else {
                // Optional: Hide the bar if not in menu
                lv_obj_add_flag(rad_bar, LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(rad_label, LV_OBJ_FLAG_HIDDEN);
            }

binary_sensor:
  # Listens for the Overseer triggering the event
  - platform: homeassistant
    id: meltdown_active
    entity_id: input_boolean.reactor_meltdown_active
    internal: true
    on_press:
      then:
        - lambda: |-
            id(active_main_tab) = 0; // Force them to the STAT tab
            id(active_sub_tab) = 0;  // Force them to the STATUS sub-tab
            ESP_LOGW("pipboy", "EMERGENCY: MELTDOWN PROTOCOL INITIATED");
    
display:
  - platform: ili9xxx
    model: ILI9341
    spi_id: bus_a
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    auto_clear_enabled: true
    invert_colors: false
    color_palette: 8BIT
    rotation: 0
    dimensions: 
      width: 320
      height: 240
    update_interval: 50ms 
    lambda: |-
      int w = 320;
      int h = 240;
      int main_y = 25;  
      int sub_y = 55;   

      it.fill(Color(0, 0, 0));

      // 2. Main Menu Logic
      const char* main_labels[] = {"STAT", "INV", "DATA", "MAP", "RADIO"};
      int main_x_pos[] = {40, 100, 160, 220, 280};

      for (int i = 0; i < 5; i++) {
        Color draw_color = (id(active_main_tab) == i) ? id(pip_bright) : id(pip_unselected);
        it.printf(main_x_pos[i], main_y, id(pip_main_font), draw_color, TextAlign::CENTER, main_labels[i]);

        if (id(active_main_tab) == i) {
          int b_width = 25; 
          int b_height = 12;
          int cur_x = main_x_pos[i];
          
          it.line(cur_x - b_width-5, main_y - b_height, cur_x - b_width-5, main_y + b_height, id(pip_bright));
          it.line(cur_x + b_width+5, main_y - b_height, cur_x + b_width+5, main_y + b_height, id(pip_bright));
          it.line(cur_x - b_width - 5, main_y-b_height, cur_x - b_width, main_y-b_height, id(pip_bright));
          it.line(cur_x + b_width, main_y-b_height, cur_x + b_width + 5, main_y-b_height, id(pip_bright));
          
          it.line(0, main_y+b_height, cur_x - b_width - 5, main_y+b_height, id(pip_unselected));
          it.line(cur_x + b_width + 5, main_y+b_height, w, main_y+b_height, id(pip_unselected));
        }
      }

      // REACTOR MELTDOWN SLIDERS
      if (id(active_main_tab) == 0 && id(active_sub_tab) == 0 && id(meltdown_active).state) {
        
        // Left Slider: Coolant (X between 30 and 130)
        if (touch.x >= 30 && touch.x <= 130 && touch.y >= 140 && touch.y <= 200) {
          int new_val = touch.x - 30; // Converts position to a 0-100 scale
          new_val = (new_val / 5) * 5; // Snap to nearest 5 to prevent API spam
          if (new_val != (int)id(reactor_coolant).state) {
              id(set_ha_coolant).execute(new_val);
          }
        }
        
        // Right Slider: Rods (X between 190 and 290)
        if (touch.x >= 190 && touch.x <= 290 && touch.y >= 140 && touch.y <= 200) {
          int new_val = touch.x - 190; 
          new_val = (new_val / 5) * 5; 
          if (new_val != (int)id(reactor_rods).state) {
              id(set_ha_rods).execute(new_val);
          }
        }
      }

      //===DATA TAB===
      if (id(active_main_tab) == 2) {
        
        if (id(data_solved)) {
          it.printf(160, 70, id(pip_main_font), id(pip_bright), TextAlign::CENTER, "MEMORY CORE");
          it.printf(160, 100, id(pip_main_font), id(pip_bright), TextAlign::CENTER, "RESTORED");
          it.line(60, 120, 260, 120, id(pip_bright)); 
          it.printf(160, 140, id(pip_sub_font), id(pip_bright), TextAlign::CENTER, "PARITY MATCH ACCEPTED");
          it.printf(160, 180, id(pip_main_font), id(pip_bright), TextAlign::CENTER, "XP +1000");
        } 
        else {
          it.printf(160, 50, id(pip_main_font), id(pip_bright), TextAlign::CENTER, "MEMORY CORE REPAIR");
          
          int start_x = 60;
          int start_y = 80;
          int cell_w = 50;
          int cell_h = 25;
          int row_sums[4] = {0, 0, 0, 0};
          int col_sums[4] = {0, 0, 0, 0};

          int counts[16] = {0};
          for (int v : id(hex_grid)) {
            counts[v]++;
          }

          for (int r = 0; r < 4; r++) {
            for (int c = 0; c < 4; c++) {
              int index = r * 4 + c;
              int val = id(hex_grid)[index];
              bool is_locked = id(locked_cells)[index];
              bool is_duplicate = (counts[val] > 1);

              row_sums[r] += val;
              col_sums[c] += val;

              if (is_duplicate) {
                it.filled_rectangle(start_x + (c * cell_w), start_y + (r * cell_h), cell_w - 4, cell_h - 4, id(pip_unselected));
                it.printf(start_x + (c * cell_w) + 23, start_y + (r * cell_h), id(pip_sub_font), Color(0,0,0), TextAlign::TOP_CENTER, "%02X", val);
              } else {
                it.rectangle(start_x + (c * cell_w), start_y + (r * cell_h), cell_w - 4, cell_h - 4, id(pip_line));
                Color text_color = is_locked ? id(pip_unselected) : id(pip_bright);
                it.printf(start_x + (c * cell_w) + 23, start_y + (r * cell_h), id(pip_sub_font), text_color, TextAlign::TOP_CENTER, "%02X", val);
              }

              if (is_locked) {
                it.filled_rectangle(start_x + (c * cell_w) + 2, start_y + (r * cell_h) + 2, 3, 3, id(pip_unselected));
              }
            }
          }
          it.printf(160, 198, id(pip_sub_font), id(pip_bright), TextAlign::CENTER, "TARGET PARITY: %02X", id(target_sum));
          
        } // <-- THESE WERE THE CULPRITS
      }   // <-- THESE WERE THE CULPRITS
      
      // 3. STAT TAB Logic (Sub-Menu & Vault Boy)
      if (id(active_main_tab) == 0) {
        
        // CHECK FOR MELTDOWN OVERRIDE
        if (id(meltdown_active).state && id(active_sub_tab) == 0) {
          // EMERGENCY UI
          int c = id(reactor_coolant).state;
          int r = id(reactor_rods).state;
          int temp = (r - c) + 100;
          
          // Flash the warning text
          if ((millis() / 500) % 2 == 0) {
            it.printf(160, 80, id(pip_main_font), id(pip_bright), TextAlign::CENTER, "WARNING: CORE INSTABILITY");
          }

          it.printf(160, 110, id(pip_sub_font), id(pip_bright), TextAlign::CENTER, "CORE TEMP: %d%%", temp);
          
          // Show stabilization progress
          if (temp == 85) {
            it.printf(160, 195, id(pip_sub_font), id(pip_bright), TextAlign::CENTER, "- STABILIZING: %d/5 -", id(meltdown_hold_time));
          } else {
            it.printf(160, 195, id(pip_sub_font), id(pip_unselected), TextAlign::CENTER, "TARGET TEMP: 85%%");
          }

          // Coolant Slider (Left side)
          it.printf(80, 140, id(pip_sub_font), id(pip_unselected), TextAlign::CENTER, "COOLANT");
          it.rectangle(30, 160, 100, 20, id(pip_line));
          it.filled_rectangle(30, 160, c, 20, id(pip_bright)); // c goes 0 to 100

          // Rods Slider (Right side)
          it.printf(240, 140, id(pip_sub_font), id(pip_unselected), TextAlign::CENTER, "RODS");
          it.rectangle(190, 160, 100, 20, id(pip_line));
          it.filled_rectangle(190, 160, r, 20, id(pip_bright)); // r goes 0 to 100

        } else {
          // NORMAL STAT SCREEN (Vault Boy)
          id(vault_boy_anim).next_frame();
          it.image(100, 85, id(vault_boy_anim)); 

          const char* sub_labels[] = {"STATUS", "SPECIAL", "PERKS"};
          int sub_x_pos[] = {80, 160, 240};

          for (int i = 0; i < 3; i++) {
            Color sub_color = (id(active_sub_tab) == i) ? id(pip_bright) : id(pip_unselected);
            it.printf(sub_x_pos[i], sub_y, id(pip_sub_font), sub_color, TextAlign::CENTER, sub_labels[i]);
          }
        }
      }

      // 4. Footer
      it.line(0, 210, w, 210, id(pip_line));
      
      // Dynamically print the live HP and XP
      it.printf(10, 212, id(pip_sub_font), id(pip_bright), TextAlign::TOP_LEFT, "HP %d/100", id(vault_hp));
      it.printf(w - 10, 212, id(pip_sub_font), id(pip_bright), TextAlign::TOP_RIGHT, "XP %d", id(vault_xp));

touchscreen:
  platform: xpt2046
  id: my_touchscreen
  spi_id: bus_a
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  calibration:
    x_min: 150 
    x_max: 3950
    y_min: 200
    y_max: 3800
  transform:
    swap_xy: false
    mirror_x: true 
    mirror_y: true 
  on_touch:
    - lambda: |-
        // Print the fixed coordinates to your logs for debugging
        ESP_LOGI("pipboy", "Touch - X: %d, Y: %d", touch.x, touch.y);

        // 1. MAIN MENU LOGIC
        if (touch.y < 38) {
          if (touch.x < 75) id(active_main_tab) = 0;
          else if (touch.x < 135) id(active_main_tab) = 1;
          else if (touch.x < 195) id(active_main_tab) = 2;
          else if (touch.x < 255) id(active_main_tab) = 3;
          else id(active_main_tab) = 4;
        }

        // 2. DATA TAB GAME LOGIC
        if (id(active_main_tab) == 2) { 
          int start_x = 60;
          int start_y = 80;
          int cell_w = 50;
          int cell_h = 25;

          // Check if touch is within the 4x4 grid bounds
          if (touch.x >= start_x && touch.x <= (start_x + 200) && touch.y >= start_y && touch.y <= (start_y + 100)) {
            int col = (touch.x - start_x) / cell_w;
            int row = (touch.y - start_y) / cell_h;
            int index = row * 4 + col;

            if (index >= 0 && index < 16) {
              if (!id(locked_cells)[index]) {
                id(hex_grid)[index] = (id(hex_grid)[index] + 1) % 16; 
                ESP_LOGI("pipboy", "Cell [%d, %d] changed to 0x%X", row, col, id(hex_grid)[index]);
                id(check_puzzle_solved).execute();
              }
            }
          }
        }

        // 3. REACTOR MELTDOWN SLIDERS (STAT TAB)
        if (id(active_main_tab) == 0 && id(active_sub_tab) == 0 && id(meltdown_active).state) {
          
          // Left Slider: Coolant (X between 30 and 130)
          if (touch.x >= 30 && touch.x <= 130 && touch.y >= 140 && touch.y <= 200) {
            int new_val = touch.x - 30; // Converts position to a 0-100 scale
            new_val = (new_val / 5) * 5; // Snap to nearest 5 to prevent API spam
            if (new_val != (int)id(reactor_coolant).state) {
               id(set_ha_coolant).execute(new_val);
            }
          }
          
          // Right Slider: Rods (X between 190 and 290)
          if (touch.x >= 190 && touch.x <= 290 && touch.y >= 140 && touch.y <= 200) {
            int new_val = touch.x - 190; 
            new_val = (new_val / 5) * 5; 
            if (new_val != (int)id(reactor_rods).state) {
               id(set_ha_rods).execute(new_val);
            }
          }
        }

# this confirms the completion characteristics for winning.
script:
  - id: check_puzzle_solved
    then:
      - lambda: |-
          int target = id(target_sum);
          bool all_match = true;
          
          // Check rows and columns
          for(int i=0; i<4; i++) {
            int rs=0, cs=0;
            for(int j=0; j<4; j++) {
              rs += id(hex_grid)[i*4+j];
              cs += id(hex_grid)[j*4+i];
            }
            if(rs != target || cs != target) all_match = false;
          }

          // OPTIONAL: Check for uniqueness using a Bitmask (Engineering Difficulty)
          int bitmask = 0;
          bool unique = true;
          for(int v : id(hex_grid)) {
            // Check if the bit at position 'v' is already set to 1
            if((bitmask & (1 << v)) != 0) { 
              unique = false; 
              break; 
            }
            // Set the bit at position 'v' to 1
            bitmask |= (1 << v);
          }

          if (all_match && unique) { 
            id(data_solved) = true;
            id(vault_xp) += 1000;
            ESP_LOGD("pipboy", "Puzzle Solved!");
          }
      - if:
          condition:
            lambda: 'return id(data_solved);'
          then:
            - homeassistant.service:
                service: input_boolean.turn_on
                data:
                  entity_id: input_boolean.data_puzzle_complete
            # Re-enable your animation or a "Success" screen
            # - lambda: 'id(active_main_tab) = 0; // Kick them back to STAT screen'
  # Sends Player 1's Coolant adjustments to HA
  - id: set_ha_coolant
    parameters:
      val: int
    then:
      - homeassistant.service:
          service: input_number.set_value
          data:
            entity_id: input_number.reactor_coolant
            value: !lambda 'return val;'

  # Sends Player 2's Rod adjustments to HA
  - id: set_ha_rods
    parameters:
      val: int
    then:
      - homeassistant.service:
          service: input_number.set_value
          data:
            entity_id: input_number.reactor_rods
            value: !lambda 'return val;'

interval:
  - interval: 1s
    id: meltdown_logic_loop
    then:
      - if:
          condition:
            lambda: 'return id(meltdown_active).state;'
          then:
            # Step 1: Do the math
            - lambda: |-
                int c = id(reactor_coolant).state;
                int r = id(reactor_rods).state;
                int temp = (r - c) + 100;

                if (temp == 85) {
                  id(meltdown_hold_time) += 1;
                  ESP_LOGI("pipboy", "Reactor Temp optimal! Hold time: %d", id(meltdown_hold_time));
                } else {
                  // They messed up, reset the timer!
                  id(meltdown_hold_time) = 0;
                }
            
            # Step 2: Check for the Win
            - if:
                condition:
                  lambda: 'return id(meltdown_hold_time) >= 5;'
                then:
                  - lambda: |-
                      id(vault_xp) += 2500;
                      id(meltdown_hold_time) = 0;
                      ESP_LOGI("pipboy", "Meltdown Averted! XP Awarded.");
                  
                  # Use standard YAML to safely talk to Home Assistant
                  - homeassistant.service:
                      service: input_boolean.turn_off
                      data:
                        entity_id: input_boolean.reactor_meltdown_active
