esphome:
  name: esphome-web-6e554c
  friendly_name: CYDisplay
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

output:
  - platform: ledc
    pin: GPIO27
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON
    
spi:
  - id: bus_a
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
    interface: hardware

font:
  - file: "monofonto.otf"
    id: pip_main_font
    size: 24
    glyphs: 
      - ' !"%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
  - file: "monofonto.otf"
    id: pip_sub_font
    size: 18
    # Add this glyphs section:
    glyphs:
      - ' !"%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
      - 'Σ'  # Explicitly include the Sigma

color:
  - id: pip_bright
    red: 0%
    green: 100%
    blue: 0%
  - id: pip_unselected # Try about 60% bright for unselected text
    red: 0%
    green: 60%
    blue: 0%
  - id: pip_line # A faint green for overall row structure/lines
    red: 0%
    green: 20%
    blue: 0%

animation:
  - file: "vaultboy-thumbsup3.gif"  # "cat-walking.gif"
    id: vault_boy_anim
    type: RGB565 # Use 'BINARY' if you want that retro 1-color green look
    # resize: 120x120 # Optional: ESPHome can resize it for you

globals:
  - id: active_main_tab
    type: int
    restore_value: no
    initial_value: '0' # 0=STAT, 1=INV, 2=DATA, 3=MAP, 4=RADIO
  - id: active_sub_tab
    type: int
    restore_value: no
    initial_value: '0' # 0=STATUS, 1=SPECIAL, 2=PERKS
  # The Hex Matrix Data
  - id: hex_grid
    type: std::vector<int>
    initial_value: '{0x1, 0xA, 0x3, 0x4, 0x5, 0x2, 0x7, 0x8, 0x9, 0x6, 0xB, 0xC, 0xD, 0xE, 0xF, 0x0}'
  - id: target_sum
    type: int
    initial_value: '30' # Decimal 30 = 0x1E
  # The puzzle state tracker
  - id: data_solved
    type: bool
    initial_value: 'false'
    restore_value: no
  # The XP/RPG tracker
  - id: vault_xp
    type: int
    initial_value: '0'
    restore_value: yes # 'yes' means it saves even if the Pip-Boy restarts!

display:
  - platform: ili9xxx
    model: ILI9341
    spi_id: bus_a
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4 # Adding the reset pin is recommended for the CYD
    auto_clear_enabled: true
    invert_colors: false
    color_palette: 8BIT
    rotation: 0
    dimensions: 
      width: 320
      height: 240
    update_interval: 50ms # Fast enough for smooth animation
    lambda: |-
      int w = 320;
      int h = 240;
      int main_y = 25;  
      int sub_y = 55;   

      it.fill(Color::BLACK);

      // 1. Reserved Animation Space (120x120)
      // it.image(100, 85, id(vault_boy_anim)); // Commented out per request

      // 2. Main Menu Logic
      const char* main_labels[] = {"STAT", "INV", "DATA", "MAP", "RADIO"};
      int main_x_pos[] = {40, 100, 160, 220, 280};

      for (int i = 0; i < 5; i++) {
        Color draw_color = (id(active_main_tab) == i) ? id(pip_bright) : id(pip_unselected);
        it.printf(main_x_pos[i], main_y, id(pip_main_font), draw_color, TextAlign::CENTER, main_labels[i]);

        // Draw brackets only for the active tab
        if (id(active_main_tab) == i) {
          int b_width = 25; 
          int b_height = 12;
          int cur_x = main_x_pos[i];
          
          // Brackets
          it.line(cur_x - b_width-5, main_y - b_height, cur_x - b_width-5, main_y + b_height, id(pip_bright));
          it.line(cur_x + b_width+5, main_y - b_height, cur_x + b_width+5, main_y + b_height, id(pip_bright));
          it.line(cur_x - b_width - 5, main_y-b_height, cur_x - b_width, main_y-b_height, id(pip_bright));
          it.line(cur_x + b_width, main_y-b_height, cur_x + b_width + 5, main_y-b_height, id(pip_bright));
          
          // Footer line connections to the active bracket
          it.line(0, main_y+b_height, cur_x - b_width - 5, main_y+b_height, id(pip_unselected));
          it.line(cur_x + b_width + 5, main_y+b_height, w, main_y+b_height, id(pip_unselected));
        }
      }

      //===DATA TAB===
      if (id(active_main_tab) == 2) {
        it.printf(160, 50, id(pip_main_font), id(pip_bright), TextAlign::CENTER, "MEMORY CORE REPAIR");
        
        int start_x = 35;
        int start_y = 68;
        int cell_w = 50;
        int cell_h = 25;
        int row_sums[4] = {0, 0, 0, 0};
        int col_sums[4] = {0, 0, 0, 0};

        // Draw Grid and Starting values
        for (int r = 0; r < 4; r++) {
          for (int c = 0; c < 4; c++) {
            int val = id(hex_grid)[r * 4 + c];
            row_sums[r] += val;
            col_sums[c] += val;

            // Draw Cell Box
            it.rectangle(start_x + (c * cell_w), start_y + (r * cell_h), cell_w - 4, cell_h - 4, id(pip_line));
            // Draw Hex Value
            it.printf(start_x + (c * cell_w) + 23, start_y + (r * cell_h), id(pip_sub_font), id(pip_bright), TextAlign::TOP_CENTER, "%02X", val);
          }
        }
        it.printf(160, 198, id(pip_sub_font), id(pip_bright), TextAlign::CENTER, "TARGET PARITY: %02X", id(target_sum));
#        // Draw Row Checksums (Right Side)
#        for (int r = 0; r < 4; r++) {
#          Color c = (row_sums[r] == id(target_sum)) ? id(pip_bright) : id(pip_unselected);
#          it.printf(start_x + (4 * cell_w) + 10, start_y + (r * cell_h), id(pip_sub_font), c, "Σ:%02X", row_sums[r]);
#        }

#        // Draw Column Checksums (Bottom Side)
#        for (int c = 0; c < 4; c++) {
#          Color color = (col_sums[c] == id(target_sum)) ? id(pip_bright) : id(pip_unselected);
#          it.printf(start_x + (c * cell_w) + 20, start_y + (4 * cell_h), id(pip_sub_font), color, TextAlign::TOP_CENTER, "Σ:%02X", col_sums[c]);
#        }
      }

      // 3. Sub-Menu Logic (Only show if STAT is selected)
      if (id(active_main_tab) == 0) {
        const char* sub_labels[] = {"STATUS", "SPECIAL", "PERKS"};
        int sub_x_pos[] = {80, 160, 240};

        for (int i = 0; i < 3; i++) {
          Color sub_color = (id(active_sub_tab) == i) ? id(pip_bright) : id(pip_unselected);
          it.printf(sub_x_pos[i], sub_y, id(pip_sub_font), sub_color, TextAlign::CENTER, sub_labels[i]);
        }
      }

      // 4. Footer
      it.line(0, 210, w, 210, id(pip_line));
      it.printf(10, 212, id(pip_sub_font), id(pip_bright), TextAlign::TOP_LEFT, "HP 115/115");
      it.printf(w - 10, 212, id(pip_sub_font), id(pip_bright), TextAlign::TOP_RIGHT, "AP 90/90");

#logic for animation
#      // 1. Logic to advance the frame
#      //id(vault_boy_anim).next_frame();
#
#      // 2. Draw the animation at coordinates x=100, y=50
#      //it.image(100, 50, id(vault_boy_anim));
#      
#      // 3. Optional: Add your Pip-Boy text around it
#      //it.printf(160, 20, id(pip_font), id(pip_green), TextAlign::CENTER, "S.P.E.C.I.A.L.");

touchscreen:
  platform: xpt2046
  id: my_touchscreen
  spi_id: bus_a
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  calibration:
    # Always Smallest to Largest here
    x_min: 150 
    x_max: 3950
    y_min: 200
    y_max: 3800
  transform:
    swap_xy: false
    # We use these to flip the axes instead of swapping min/max
    mirror_x: true 
    mirror_y: true 
  on_touch:
    - lambda: |-
        // This will print the fixed coordinates to your logs
        ESP_LOGI("pipboy", "Touch - X: %d, Y: %d", touch.x, touch.y);

        // Menu Logic
        if (touch.y < 38) {
          if (touch.x < 75) id(active_main_tab) = 0;
          else if (touch.x < 135) id(active_main_tab) = 1;
          else if (touch.x < 195) id(active_main_tab) = 2;
          else if (touch.x < 255) id(active_main_tab) = 3;
          else id(active_main_tab) = 4;
        }

        // DATA TAB GAME
        if (id(active_main_tab) == 2) { // DATA TAB
          int start_x = 35;
          int start_y = 68;
          int cell_w = 50;
          int cell_h = 25;

          // Check if touch is within the 4x4 grid bounds
          if (touch.x >= start_x && touch.x <= (start_x + 200) && touch.y >= start_y && touch.y <= (start_y + 100)) {
            int col = (touch.x - start_x) / cell_w;
            int row = (touch.y - start_y) / cell_h;
            int index = row * 4 + col;

            if (index >= 0 && index < 16) {
              id(hex_grid)[index] = (id(hex_grid)[index] + 1) % 16; // Cycles 0-15 (0x0 - 0xF)
              ESP_LOGI("pipboy", "Cell [%d, %d] changed to 0x%X", row, col, id(hex_grid)[index]);
            }
          }
        }


script:
  - id: check_puzzle_solved
    then:
      - lambda: |-
          int target = id(target_sum);
          bool all_match = true;
          // Check rows and cols (simplified check)
          for(int i=0; i<4; i++) {
            int rs=0, cs=0;
            for(int j=0; j<4; j++) {
              rs += id(hex_grid)[i*4+j];
              cs += id(hex_grid)[j*4+i];
            }
            if(rs != target || cs != target) all_match = false;
          }
          
          if (all_match && !id(data_solved)) {
            id(data_solved) = true;
            id(vault_xp) += 500;
            ESP_LOGD("pipboy", "DATA PUZZLE SOLVED!");
          }
